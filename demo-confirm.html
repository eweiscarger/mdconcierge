<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>MDconcierge — Confirm Demonstration</title>
<link rel="icon" href="assets/brand/favicon-32.png"/>
<link rel="stylesheet" href="funnel-assets/funnel.css"/>
</head>
<body data-funnel-page="demo-confirm">
<div class="wrap">
  <div class="topbar"><img src="assets/brand/logo.png" alt="MDconcierge"/></div>
  <div class="card"><div class="body">
    <div id="status"><p class="lead">One moment&hellip;</p></div>
  </div></div>
  <div class="foot">MDconcierge &middot; <a href="mailto:eric@mdconcierge.net">eric@mdconcierge.net</a></div>
</div>
<script>
const FN = "https://pjdbzrzadlldojuvdrfj.supabase.co/functions/v1";
const p = new URLSearchParams(location.search);
const t = p.get("t") || "";
const d = (p.get("d") || "").toLowerCase() === "yes" ? "yes" : "no";
const box = document.getElementById("status");

function render(html){ box.innerHTML = html; }

// Confirming a demo means Phil is hosting it, so this is the one moment we can collect his link
// without chasing him for it. A standing room link is deliberately not an option: two demos in a
// day would share a URL and one physician could walk into another's meeting.
function askForLink(){
  return new Promise(function(resolve){
    render('<div class="eyebrow">One thing first</div><h1>Your Zoom link for this demonstration</h1>'
      + '<p class="lead">Paste the meeting link you want the physician to join. It goes straight into their confirmation and onto both calendars.</p>'
      + '<input id="zl" placeholder="https://us02web.zoom.us/j/..." style="width:100%;font-size:15px;padding:12px 14px;border:1px solid #CFE0F0;border-radius:10px;box-sizing:border-box;"/>'
      + '<p id="zerr" style="color:#c0392b;font-size:13.5px;min-height:18px;margin:6px 0 0;"></p>'
      + '<p style="margin:14px 0 0;"><button id="zgo" style="background:#1e9e6a;color:#fff;padding:12px 24px;border:0;border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;">Confirm the demonstration</button></p>'
      + '<p style="color:#5C6B85;font-size:13px;margin-top:14px;">Prefer to send it yourself later? <a href="#" id="zskip">Confirm without a link</a> and the physician is told it follows.</p>');
    const go=document.getElementById('zgo'), inp=document.getElementById('zl'), err=document.getElementById('zerr');
    inp.focus();
    go.onclick=function(){
      const v=inp.value.trim();
      if (v && !/^https?:\/\/\S+$/i.test(v)){ err.textContent='That does not look like a link. Paste the full https:// address.'; return; }
      if (!v){ err.textContent='Paste the link, or use the option below to confirm without one.'; return; }
      resolve(v);
    };
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') go.click(); });
    document.getElementById('zskip').onclick=function(e){ e.preventDefault(); resolve(''); };
  });
}

(async function(){
  if (!t){ render('<h1>Link expired</h1><p class="lead">This confirmation link is missing its code. Please use the buttons in the email.</p>'); return; }
  let joinUrl = '';
  if (d === "yes") joinUrl = await askForLink();
  render('<p class="lead">' + (d==="yes" ? "Confirming the demonstration&hellip;" : "Noting that you can\'t make it&hellip;") + '</p>');
  try {
    const r = await fetch(`${FN}/booking-approve`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ t, d, join_url: joinUrl }) });
    const j = await r.json();
    if (j.already){
      const s = j.status;
      render('<h1>Already handled</h1><p class="lead">This demonstration was already marked <b>'+ (s==="confirmed"?"confirmed":"declined") +'</b>. Nothing more to do.</p>');
      return;
    }
    if (!j.ok){ render('<h1>Hmm</h1><p class="lead">'+ (j.error || "Something went wrong. Reply to the email and we\'ll sort it out.") +'</p>'); return; }
    if (j.status === "confirmed"){
      render('<div class="eyebrow">Confirmed</div><h1>Great, it\'s booked.</h1><p class="lead">The demonstration is confirmed for <b>'+ (j.when||"the requested time") +'</b>. The physician has been sent their confirmation and the two legal write-ups, and the event is on the calendar with you as an attendee.</p>');
    } else {
      render('<div class="eyebrow">Noted</div><h1>Thanks, all set.</h1><p class="lead">The physician has been told that time is no longer available and sent a link to pick another. No further action needed.</p>');
    }
  } catch(e){ render('<h1>Network hiccup</h1><p class="lead">Could not reach the server. Please try the link again in a moment.</p>'); }
})();
</script>
</body>
</html>
