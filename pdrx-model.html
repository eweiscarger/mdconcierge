async function unlock(token, viewer){
  const body = viewer ? { token, viewer } : { token };
  let data;
  try{
    const r = await fetch(FN, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    data = await r.json();
  }catch(e){ return errScreen('error'); }

  if(data && data.ok){
    if(viewer){ try{ localStorage.setItem(whoKey(token), JSON.stringify(viewer)); }catch(e){} }
    FORM = data.formulary || []; REC = data.recipient || {};
    const V = data.viewer || REC;
    HIDE_COST = !!V.hide_cost;
    watermark(V.name || REC.name, V.email || REC.email);
    return render(data.expires_at);
  }
  const reason = (data && data.reason) || 'error';
  if(reason === 'identify'){ return identifyScreen(data.recipient_name, data.practice, 'choose'); }
  return errScreen(reason, data && data.expires_at);

// Every state sets its own WC pharmacy reimbursement. Most are a percentage of AWP, which is the
// multiplier this model runs on: PA pays AWP + 10% (1.10), New York pays AWP - 12% (0.88).
// These are the PHARMACY fee schedule rates, which is what this program bills under: the script
// is filled and shipped by the mail-order pharmacy, not handed to the patient in the office. Some
// states publish a separate, higher rate for a physician who dispenses in office (Florida pays a
// dispensing practitioner AWP +12.5%); that rate does not apply here and is not used.
// br/gr are the brand and generic multipliers; dfb/dfg are the per-script dispensing fees the
// schedule pays out, shown but deliberately NOT added to the estimate, so it never overstates.
// basis 'other' means the state does not price off AWP at all (usual and customary, "reasonable",
// Medi-Cal, WAC). Those cannot honestly be reduced to a multiplier, so they say so instead.

// The states the pharmacy is actually licensed in. The full table above is kept intact so adding
// a state later is one edit here, not a re-research job.
// PDRx is licensed in every state, so the whole schedule table is selectable.
const ACTIVE = STATES.map(s => s.c);
const SERVED = STATES.filter(s => ACTIVE.includes(s.c));

let ST = STATES.find(s=>s.c==='PA');
// Every product in this formulary dispenses as a generic: the brand names in the product column
// are the AWP reference label, and acquisition cost sits at a median 5% of AWP, which no brand
// does. So the generic rate always applies and there is no basis to ask the doctor to choose.
// Offering the choice let someone apply a brand rate to a generic basket and understate himself
// by 20-25% in Louisiana or Texas.
const DRUGTYPE = 'gr';

function stateByCode(c){ return STATES.find(s=>s.c===String(c||'').toUpperCase()); }
// States with no published AWP schedule (usual and customary, "reasonable", prevailing community
// rate) fall back to flat AWP as the working assumption rather than leaving the doctor with a
// blank. It is still labelled as an assumption, because it is one.
function stMult(s,t){ return s ? (s.basis==='other' ? 1 : (t==='br'?s.br:s.gr)) : null; }
function basisLabel(){ return ST ? (ST.n + ' basis') : 'custom basis'; }

// Switching state rewrites the multiplier and every label that names a state, so the page can
// never show Pennsylvania wording while running New York math.
function applyState(code, keepMult){
  const s = stateByCode(code); if(!s) return;
  ST = s;
  const m = stMult(s, DRUGTYPE);
  const inp = document.getElementById('a-mult');
  if(inp && !keepMult && m != null) inp.value = m;
  // The state's own dispensing fee is extra REIMBURSEMENT the schedule pays out, which is a
  // different thing from the per-script fee the practice pays under the program. It stays
  // informational and out of the math, which keeps the estimate conservative.
  const df = DRUGTYPE==='br' ? s.dfb : s.dfg;
  const note = document.getElementById('fs-note');
  if(note){
    if(s.basis==='other'){
      note.innerHTML = '<b>'+esc(s.n)+':</b> '+esc(s.r)+'. With no published AWP schedule to follow, this is modelled at <b>flat AWP</b> as a working assumption. Change it to whatever you actually collect.';
      note.style.color = '';
    } else {
      const gr = s.gr.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
      const br = s.br.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
      note.innerHTML = '<b>'+esc(s.n)+':</b> '+esc(s.r)
        + (df ? ' &middot; the schedule also pays a $'+df.toFixed(2)+' dispensing fee per script, left out of the estimate below' : '')
        + ' &middot; generic rate '+gr+'&times; applied'
        + (s.br!==s.gr ? ' (its brand rate is '+br+'&times;, which does not apply here)' : '');
      note.style.color = '';
    }
  }
  ['basis-sub','basis-foot','basis-disc'].forEach(id=>{ const e=document.getElementById(id); if(e) e.textContent = basisLabel(); });
  const fh=document.getElementById('basis-form');
  if(fh) fh.textContent = FORM.length+' products · '+s.c+' reimbursement = '+m+' × MFG AWP'+(s.basis==='other'?' (assumed)':'');
  // The reimbursement column header carries the state code, and it is rebuilt from ST inside
  // renderFormHead, so refreshing the table is enough to relabel it.
  applyForm(); compute();
}

function addLine(){

  const d = document.createElement('div'); d.className='mixrow';
  d.innerHTML = `<select onchange="compute()">${window._OPTS}</select>
    <input type="number" value="1" min="0" step="0.5" title="units per patient / month" oninput="compute()">
    <button class="btn noprint" onclick="this.closest('.mixrow').remove();compute()" title="remove">✕</button>`;
  box.appendChild(d);
}

function fById(id){ return FORM.find(f=>String(f.id)===String(id)); }

// Typing over the multiplier by hand has to move the formulary column too, not just the headline.
function multChanged(){ compute(); filterForm(); }

function compute(){
  const num = id => { const e=document.getElementById(id); return e?(parseFloat(e.value)||0):0; };
  const patients=num('a-pat'), mult=num('a-mult'), oc=num('a-oc')/100, tc=num('a-tc')/100, share=num('a-sh')/100;
  const fee=num('a-df'), ship=num('a-ship');
  let oAwp=0,oCost=0,tAwp=0,tCost=0,oScripts=0,tScripts=0; const lines=[];
  document.querySelectorAll('#mix .mixrow').forEach(row=>{
    const id=(row.querySelector('select')||{}).value; const units=parseFloat((row.querySelector('input')||{}).value)||0;
    const f=fById(id); if(!f||!units) return;
    const paAwp=(Number(f.awp)||0)*mult, extAwp=units*paAwp, extCost=units*(Number(f.cost)||0);
    if(f.route==='Oral'){ oAwp+=extAwp; oCost+=extCost; oScripts+=units; } else { tAwp+=extAwp; tCost+=extCost; tScripts+=units; }
    lines.push(f.product);
  });
  // Dispensing and shipping are charges against the practice, not something it collects, and both
  // are per Rx order rather than per medication: a patient on five drugs carries one $6 dispensing
  // fee and one $6 shipping charge, not five of each.
  const oGross=oAwp*patients*oc, tGross=tAwp*patients*tc;
  // Under PDRx the dispense fee and shipping are part of the claims purchase fee on every script,
  // not one charge per patient order, which is how the formulary sheet prices them.
  const feeCost=(oScripts+tScripts)*patients*(fee+ship);
  const gross=oGross+tGross, cost=(oCost+tCost)*patients+feeCost, net=gross-cost, practice=net*share;
  // Say plainly that the fee is the practice's cost and that it is already taken out, rather than
  // leaving it to be discovered inside a breakdown line.
  const dfn=document.getElementById('df-note');
  if(dfn){
    dfn.innerHTML = (fee||ship)
      ? '<b>Claims purchase fee, per script:</b> the wholesale cost of the medication plus $'+fee.toFixed(2)+' dispensing and $'+ship.toFixed(2)+' shipping, deducted from collections. Shipping runs $7.00 to $10.00 and is modelled here at $'+ship.toFixed(2)+'. Collections average about 60 days.'
      : '<b>Dispensing and shipping:</b> none applied. Set them above if your agreement includes them.';
  }
  const el=document.getElementById('result'); if(!el) return;
  el.innerHTML = `
    <div class="lbl">Estimated practice ancillary revenue</div>
    <div class="big">${money(practice)}<span style="font-size:15px;color:#547;font-weight:400;"> / month</span></div>
    <div class="yr">${money(practice*12)} / year</div>
    <div class="brk">Gross collections ${money(gross)}/mo · Claims purchase fees ${money(cost)}/mo${feeCost?' (includes '+money(feeCost)+'/mo of dispensing and shipping)':''} · Net income ${money(net)}/mo · Management fee ${money(net-practice)}/mo · Practice keeps ${Math.round(share*100)}% of net${lines.length?' · '+lines.length+' medication'+(lines.length>1?'s':''):''}</div>
    <div class="disc">${(fee||ship)?('Net of the $'+(fee+ship).toFixed(2)+' per Rx the practice pays for dispensing and shipping. '):''}Good-faith estimate; actual results vary by utilization, payer mix, and jurisdiction. <span id="basis-disc">${esc(basisLabel())}</span>.</div>`;
}

  const q=((document.getElementById('fsearch')||{}).value||'').toLowerCase();
  const cat=((document.getElementById('fcat')||{}).value||'');
  const rt=((document.getElementById('froute')||{}).value||'');
  let rows = FORM.filter(f=>{
    if(cat && (f.category||'')!==cat) return false;
    if(rt){ const isOral=(f.route==='Oral'); if(rt==='Oral'&&!isOral) return false; if(rt==='Topical'&&isOral) return false; }
    if(q && !((f.product+' '+(f.category||'')+' '+(f.route||'')).toLowerCase().includes(q))) return false;
    return true;
  });
  const k=FSORT.key, d=FSORT.dir;
  rows.sort((a,b)=>{
    const va = k==='reimb'?reimbOf(a):(k==='awp'||k==='cost'?Number(a[k])||0:String(a[k]||'').toLowerCase());
    const vb = k==='reimb'?reimbOf(b):(k==='awp'||k==='cost'?Number(b[k])||0:String(b[k]||'').toLowerCase());
    return va<vb ? -d : va>vb ? d : 0;
  });
  renderFormHead();
  fillFormTable(rows);
  const cnt=document.getElementById('fcount');
  if(cnt) cnt.textContent = rows.length===FORM.length ? '' : (rows.length+' of '+FORM.length+' shown');
}
function clearForm(){
  ['fsearch','fcat','froute'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  applyForm();
}
function fillFormTable(rows){
  const b=document.getElementById('fbody'); if(!b) return;
  // Reimbursement is derived from the live multiplier, not the stored PA figure, so the column
  // always agrees with the state selected above.
  b.innerHTML = rows.map(f=>`<tr class="${FSEL.has(String(f.id))?'selrow':''}" onclick="toggleSel('${f.id}')">
    <td class="noprint" style="text-align:center;"><input type="checkbox" ${FSEL.has(String(f.id))?'checked':''} onclick="event.stopPropagation();toggleSel('${f.id}')"></td>
    <td>${esc(f.product)}</td><td style="color:var(--muted);">${esc(f.category||'')}</td><td>${esc(f.route||'')}</td>
    <td class="num">${money(f.awp)}</td>${HIDE_COST?'':`<td class="num">${money(f.cost)}</td>`}<td class="num">${money(reimbOf(f))}</td></tr>`).join('');
}
function toggleSel(id){
  id=String(id);
  if(FSEL.has(id)) FSEL.delete(id); else FSEL.add(id);
  applyForm(); renderSelBar();
}
function renderSelBar(){
  const bar=document.getElementById('selbar'); if(!bar) return;
  if(!FSEL.size){ bar.style.display='none'; bar.innerHTML=''; return; }
  bar.style.display='block';
  bar.innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:11px 14px;background:#eef6ff;border:1px solid var(--steel);border-radius:10px;">
    <b style="font-size:14px;">${FSEL.size} selected</b>
    <button class="btn solid" onclick="addSelected()">Add to my mix</button>
    <button class="btn" onclick="FSEL.clear();applyForm();renderSelBar();">Clear selection</button>
  </div>`;
}
function addSelected(){
  const ids=[...FSEL];
  if(!ids.length) return;
  ids.forEach(id=>{
    // Re-use an empty row before making a new one, so the mix does not fill up with blanks.
    let row=[...document.querySelectorAll('#mix .mixrow')].find(r=>!r.querySelector('select').value);
    if(!row){ addLine(); const all=document.querySelectorAll('#mix .mixrow'); row=all[all.length-1]; }
    row.querySelector('select').value=String(id);
    if(!parseFloat(row.querySelector('input').value)) row.querySelector('input').value='1';
  });
  FSEL.clear(); applyForm(); renderSelBar(); compute();
  const mix=document.getElementById('mix');
  if(mix) mix.scrollIntoView({behavior:'smooth', block:'center'});
}
// Kept so the multiplier and state handlers can refresh the table without knowing the details.
function filterForm(){ applyForm(); }

boot();
</script>
</body>
</html>
