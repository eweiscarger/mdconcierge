<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Workers' Compensation Medication Dispensing Analysis · MDconcierge Pharmacy Partner</title>
<style>
  :root{ --navy:#08214C; --steel:#3f6ea5; --green:#1e7a4d; --ink:#1a2233; --muted:#5b6675; --line:#e2e7ef; --bg:#f4f6fa; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  .wrap{ max-width:940px; margin:0 auto; padding:0 18px 60px; }
  /* watermark */
  #wm{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  #wm div{ position:absolute; white-space:nowrap; transform:rotate(-30deg); color:rgba(8,33,76,.055); font-weight:700; font-size:20px; letter-spacing:1px; }
  .above{ position:relative; z-index:1; }
  /* banner */
  #conf{ background:#08214C; color:#eaf1fb; font-size:12.5px; text-align:center; padding:8px 14px; letter-spacing:.2px; }
  #conf b{ color:#fff; }
  header.h{ text-align:center; padding:26px 0 10px; }
  .kicker{ text-transform:uppercase; letter-spacing:2px; font-size:11px; color:var(--steel); font-weight:700; }
  h1{ font-family:Georgia,'Times New Roman',serif; color:var(--navy); font-size:26px; margin:6px 0 2px; }
  .sub{ color:var(--muted); font-size:14px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:16px 0; box-shadow:0 1px 3px rgba(16,33,66,.05); }
  .card h2{ font-size:14px; text-transform:uppercase; letter-spacing:1px; color:var(--navy); margin:0 0 4px; }
  .hint{ font-size:12px; color:var(--muted); margin:0 0 12px; }
  .assume{ display:flex; flex-wrap:wrap; gap:14px; }
  .assume label{ font-size:11px; color:var(--muted); font-weight:600; }
  .assume input{ display:block; margin-top:4px; width:92px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; color:var(--ink); }
  .assume select{ display:block; margin-top:4px; width:150px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; color:var(--ink); background:#fff; }
  .dtbtn{ border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px; padding:5px 14px; font-size:12px; font-weight:700; cursor:pointer; }
  .dtbtn.on{ border-color:var(--navy); background:var(--navy); color:#fff; }
  .mixrow{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .mixrow select{ flex:1; min-width:180px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; background:#fff; }
  .mixrow input{ width:76px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; }
  .btn{ border:1px solid var(--steel); background:#fff; color:var(--navy); border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn:hover{ background:#eef3fb; }
  .btn.solid{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .result{ background:linear-gradient(180deg,#f0f8f3,#eaf6ef); border:1px solid #bfe0cd; border-radius:14px; padding:20px; text-align:center; }
  .result .lbl{ text-transform:uppercase; letter-spacing:1px; font-size:11px; color:#3d7d5c; font-weight:700; }
  .result .big{ font-size:40px; font-weight:800; color:var(--green); line-height:1.1; margin:2px 0; }
  .result .yr{ font-size:20px; font-weight:700; color:var(--green); }
  .result .brk{ font-size:12.5px; color:#547; margin-top:10px; }
  .result .disc{ font-size:11px; color:#7a8596; font-style:italic; margin-top:8px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td{ text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th{ color:var(--navy); font-size:11px; text-transform:uppercase; letter-spacing:.5px; position:sticky; top:0; background:#fff; }
  td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .tablewrap{ max-height:420px; overflow:auto; border:1px solid var(--line); border-radius:10px; }
  #fsearch{ width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; margin-bottom:10px; }
  .foot{ text-align:center; color:var(--muted); font-size:12px; margin-top:22px; }
  .state{ text-align:center; padding:70px 20px; }
  .state h1{ font-size:22px; }
  .pill{ display:inline-block; background:#eef3fb; color:var(--steel); font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
  @media print{
    body{ background:#fff; } #conf{ background:#08214C !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .noprint{ display:none !important; } .tablewrap{ max-height:none; } #wm div{ color:rgba(8,33,76,.07); }
  }
</style>
</head>
<body>
<div id="wm"></div>
<div id="app" class="above">
  <div class="state"><h1>Loading your analysis…</h1><p class="sub">One moment.</p></div>
</div>

<script>
const FN = "https://pjdbzrzadlldojuvdrfj.supabase.co/functions/v1/formulary-access";
const app = document.getElementById('app');
const money = n => '$' + Math.round(n||0).toLocaleString('en-US');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FORM = [], REC = {};

function tokenFromUrl(){
  const u = new URL(location.href);
  return u.searchParams.get('t') || u.searchParams.get('token') || '';
}

function watermark(name, email){
  const wm = document.getElementById('wm'); wm.innerHTML='';
  const txt = (name||'Confidential') + '  ·  ' + (email||'') ;
  for(let r=0;r<14;r++){ for(let c=0;c<4;c++){ const d=document.createElement('div'); d.textContent=txt; d.style.top=(r*130-60)+'px'; d.style.left=(c*360-120)+'px'; wm.appendChild(d); } }
}

function errScreen(reason, expires){
  const map = {
    expired: ["This link has expired","For an updated analysis, just reply to the email this link came from and I'll send a fresh one."],
    revoked: ["This link is no longer active","Please reach out to Eric for an updated link."],
    invalid: ["This link isn't valid","Double-check the link from your email, or reply and I'll resend it."],
    missing: ["No access token","Open the link exactly as it appears in your email."],
    error:   ["Something went wrong loading this","Please try again in a moment, or reply to the email for help."]
  };
  const m = map[reason] || map.error;
  const exp = expires ? '<p class="sub">Expired '+new Date(expires).toLocaleDateString()+'.</p>' : '';
  app.innerHTML = '<div class="state"><span class="pill">MDconcierge Pharmacy Partner</span><h1>'+m[0]+'</h1>'+exp+'<p class="sub">'+m[1]+'</p><p class="foot">Eric Weiscarger · MDconcierge · eric@mdconcierge.net</p></div>';
}

async function boot(){
  const token = tokenFromUrl();
  if(!token){ return errScreen('missing'); }
  let data;
  try{
    const r = await fetch(FN, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token }) });
    data = await r.json();
  }catch(e){ return errScreen('error'); }
  if(!data || !data.ok){ return errScreen((data&&data.reason)||'error', data&&data.expires_at); }
  FORM = data.formulary || []; REC = data.recipient || {};
  watermark(REC.name, REC.email);
  render(data.expires_at);
}

// ---- State workers' comp pharmacy fee schedules ------------------------------------------------
// Every state sets its own WC pharmacy reimbursement. Most are a percentage of AWP, which is the
// multiplier this model runs on: PA pays AWP + 10% (1.10), New York pays AWP - 12% (0.88).
// br/gr are the brand and generic multipliers; dfb/dfg are the per-script dispensing fees, which
// are shown but deliberately NOT added to the estimate, so the number here never overstates.
// basis 'other' means the state does not price off AWP at all (usual and customary, "reasonable",
// Medi-Cal, WAC). Those cannot honestly be reduced to a multiplier, so they say so instead.
// Sources: Optum Workers' Comp Pharmacy Resource Guide, March 2026 and 2025 editions; MyMatrixx
// regulatory rundowns 2026 for the CT, MS and AL changes. Verify before relying on it.
const FS_ASOF = 'July 2026';
const STATES = [
  {c:'AL',n:'Alabama',br:1.05,gr:1.05,dfb:11.71,dfg:15.22,r:'AWP + 5%'},
  {c:'AK',n:'Alaska',br:1.00,gr:1.00,dfb:5.00,dfg:10.00,r:'AWP (no percentage adjustment)'},
  {c:'AZ',n:'Arizona',br:0.85,gr:0.75,dfb:7.00,dfg:7.00,r:'AWP - 15% brand, AWP - 25% generic'},
  {c:'AR',n:'Arkansas',br:1.00,gr:1.00,dfb:5.13,dfg:5.13,r:'AWP (no percentage adjustment)'},
  {c:'CA',n:'California',basis:'other',r:'Medi-Cal based drug rate, not an AWP multiplier'},
  {c:'CO',n:'Colorado',br:1.00,gr:1.00,dfb:4.00,dfg:4.00,r:'AWP (no percentage adjustment)'},
  {c:'CT',n:'Connecticut',br:0.80,gr:0.20,dfb:5.00,dfg:8.00,r:'AWP - 20% brand, AWP - 80% generic (eff. 7/15/2026)'},
  {c:'DE',n:'Delaware',br:0.681,gr:0.62,dfb:3.29,dfg:4.10,r:'AWP - 31.9% brand, AWP - 38% generic'},
  {c:'DC',n:'District of Columbia',basis:'other',r:'Usual and customary, no AWP fee schedule'},
  {c:'FL',n:'Florida',br:1.00,gr:1.00,dfb:4.18,dfg:4.18,r:'AWP (no percentage adjustment)'},
  {c:'GA',n:'Georgia',br:1.00,gr:1.00,dfb:4.83,dfg:7.25,r:'AWP (no percentage adjustment)'},
  {c:'HI',n:'Hawaii',br:1.40,gr:1.40,dfb:0,dfg:0,r:'AWP + 40%'},
  {c:'ID',n:'Idaho',br:1.00,gr:1.00,dfb:5.00,dfg:8.00,r:'AWP (no percentage adjustment)'},
  {c:'IL',n:'Illinois',basis:'other',r:'"Reasonable" charge, no AWP fee schedule'},
  {c:'IN',n:'Indiana',basis:'other',r:'"Reasonable" charge, no AWP fee schedule'},
  {c:'IA',n:'Iowa',basis:'other',r:'"Reasonable" charge, no AWP fee schedule'},
  {c:'KS',n:'Kansas',br:0.90,gr:0.85,dfb:3.00,dfg:5.00,r:'AWP - 10% brand, AWP - 15% generic'},
  {c:'KY',n:'Kentucky',br:0.90,gr:0.85,dfb:5.00,dfg:5.00,r:'AWP - 10% brand, AWP - 15% generic'},
  {c:'LA',n:'Louisiana',br:1.10,gr:1.40,dfb:11.81,dfg:11.81,r:'AWP + 10% brand, AWP + 40% generic'},
  {c:'ME',n:'Maine',basis:'other',r:'Usual and customary, no AWP fee schedule'},
  {c:'MD',n:'Maryland',basis:'other',r:'Relative value or reasonable charge'},
  {c:'MA',n:'Massachusetts',basis:'other',r:'Lesser of MMAC / AAC / U&C, not an AWP multiplier'},
  {c:'MI',n:'Michigan',br:0.90,gr:0.90,dfb:3.50,dfg:5.50,r:'AWP - 10%'},
  {c:'MN',n:'Minnesota',br:0.88,gr:0.88,dfb:3.65,dfg:3.65,r:'AWP - 12%'},
  {c:'MS',n:'Mississippi',br:0.90,gr:0.85,dfb:5.00,dfg:5.00,r:'AWP - 10% brand, AWP - 15% generic (eff. 6/1/2026)'},
  {c:'MO',n:'Missouri',basis:'other',r:'Usual and customary, no AWP fee schedule'},
  {c:'MT',n:'Montana',br:0.90,gr:0.75,dfb:3.00,dfg:3.00,r:'AWP - 10% brand, AWP - 25% generic'},
  {c:'NE',n:'Nebraska',basis:'other',r:'Actual charge or reasonable, no AWP fee schedule'},
  {c:'NV',n:'Nevada',br:1.00,gr:1.00,dfb:13.70,dfg:13.70,r:'AWP (no percentage adjustment)'},
  {c:'NH',n:'New Hampshire',basis:'other',r:'"Reasonable" charge, no AWP fee schedule'},
  {c:'NJ',n:'New Jersey',basis:'other',r:'Usual and customary, no AWP fee schedule'},
  {c:'NM',n:'New Mexico',br:0.90,gr:0.90,dfb:5.00,dfg:5.00,r:'AWP - 10%'},
  {c:'NY',n:'New York',br:0.88,gr:0.80,dfb:4.00,dfg:5.00,r:'AWP - 12% brand, AWP - 20% generic'},
  {c:'NC',n:'North Carolina',br:0.95,gr:0.95,dfb:0,dfg:0,r:'AWP - 5%'},
  {c:'ND',n:'North Dakota',basis:'other',r:'WAC based markup, not an AWP multiplier'},
  {c:'OH',n:'Ohio',br:0.85,gr:0.85,dfb:3.50,dfg:3.50,r:'AWP - 15%'},
  {c:'OK',n:'Oklahoma',br:0.90,gr:0.90,dfb:5.00,dfg:5.00,r:'AWP - 10%'},
  {c:'OR',n:'Oregon',br:0.835,gr:0.835,dfb:2.00,dfg:2.00,r:'AWP - 16.5%'},
  // PA's published schedule carries no separate dispensing fee; the $6 is Eric's actual
  // per-script fee, which he confirmed, and it beats the guide for his own state.
  {c:'PA',n:'Pennsylvania',br:1.10,gr:1.10,dfb:6.00,dfg:6.00,r:'AWP + 10%'},
  {c:'RI',n:'Rhode Island',br:0.90,gr:0.90,dfb:0,dfg:0,r:'AWP - 10%'},
  {c:'SC',n:'South Carolina',br:1.00,gr:1.00,dfb:5.00,dfg:5.00,r:'AWP (no percentage adjustment)'},
  {c:'SD',n:'South Dakota',basis:'other',r:'Usual and customary, no AWP fee schedule'},
  {c:'TN',n:'Tennessee',br:1.00,gr:1.00,dfb:5.10,dfg:5.10,r:'AWP (no percentage adjustment)'},
  {c:'TX',n:'Texas',br:1.09,gr:1.25,dfb:4.00,dfg:4.00,r:'AWP + 9% brand, AWP + 25% generic'},
  {c:'UT',n:'Utah',basis:'other',r:'"Reasonable" charge, no AWP fee schedule'},
  {c:'VT',n:'Vermont',br:1.00,gr:1.00,dfb:3.15,dfg:3.15,r:'AWP (no percentage adjustment)'},
  {c:'VA',n:'Virginia',basis:'other',r:'Prevailing community rate, no AWP fee schedule'},
  {c:'WA',n:'Washington',basis:'other',r:'State fee schedule, not an AWP multiplier'},
  {c:'WV',n:'West Virginia',basis:'other',r:'Usual and customary, no AWP fee schedule'},
  {c:'WI',n:'Wisconsin',br:1.00,gr:1.00,dfb:3.00,dfg:3.00,r:'AWP (no percentage adjustment)'},
  {c:'WY',n:'Wyoming',br:0.90,gr:0.90,dfb:5.00,dfg:5.00,r:'AWP - 10%'}
];
let ST = STATES.find(s=>s.c==='PA');
let DRUGTYPE = 'gr';   // generic is what actually moves in work comp, so it leads

function stateByCode(c){ return STATES.find(s=>s.c===String(c||'').toUpperCase()); }
function stMult(s,t){ return s && s.basis!=='other' ? (t==='br'?s.br:s.gr) : null; }
function basisLabel(){ return ST ? (ST.n + ' basis') : 'custom basis'; }

// Switching state rewrites the multiplier and every label that names a state, so the page can
// never show Pennsylvania wording while running New York math.
function applyState(code, keepMult){
  const s = stateByCode(code); if(!s) return;
  ST = s;
  const m = stMult(s, DRUGTYPE);
  const inp = document.getElementById('a-mult');
  if(inp && !keepMult && m != null) inp.value = m;
  const df = DRUGTYPE==='br' ? s.dfb : s.dfg;
  const dfi = document.getElementById('a-df');
  if(dfi && !keepMult) dfi.value = (df==null?0:df);
  const note = document.getElementById('fs-note');
  if(note){
    if(s.basis==='other'){
      note.innerHTML = '<b>'+esc(s.n)+':</b> '+esc(s.r)+'. There is no AWP multiplier to apply here, so set the multiplier yourself from what you actually collect.';
      note.style.color = '#b4472f';
    } else {
      note.innerHTML = '<b>'+esc(s.n)+':</b> '+esc(s.r)
        + (df ? ' &middot; plus a $'+df.toFixed(2)+' dispensing fee per script' : ' &middot; no separate dispensing fee')
        + ' &middot; brand '+s.br.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')+'&times; / generic '+s.gr.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')+'&times;';
      note.style.color = '';
    }
  }
  ['basis-sub','basis-foot','basis-disc'].forEach(id=>{ const e=document.getElementById(id); if(e) e.textContent = basisLabel(); });
  const fh=document.getElementById('basis-form');
  if(fh) fh.textContent = FORM.length+' products · '+s.c+' reimbursement = '+(m!=null? m+' × MFG AWP' : 'set manually');
  const th=document.getElementById('th-reimb'); if(th) th.textContent = s.c+' reimb / unit';
  fillFormTable(FORM); compute();
}
function setDrugType(t){
  DRUGTYPE = t;
  document.getElementById('dt-br').className = 'dtbtn'+(t==='br'?' on':'');
  document.getElementById('dt-gr').className = 'dtbtn'+(t==='gr'?' on':'');
  applyState(ST.c);
}
function fsKeyHtml(){
  const rows = STATES.map(s=>{
    const m = stMult(s,'gr');
    const mult = s.basis==='other' ? '<span style="color:#b4472f;">no AWP multiplier</span>'
      : (s.br===s.gr ? String(s.br) : (s.br+' / '+s.gr));
    return '<tr><td>'+esc(s.n)+'</td><td>'+mult+'</td><td style="color:var(--muted);">'+esc(s.r)+'</td></tr>';
  }).join('');
  return '<div class="tablewrap"><table><thead><tr><th>State</th><th>Multiplier (brand / generic)</th><th>Fee schedule rule</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function toggleKey(){
  const b=document.getElementById('fs-key'); if(!b) return;
  const open = b.style.display !== 'none';
  b.style.display = open ? 'none' : 'block';
  const t=document.getElementById('fs-key-btn'); if(t) t.textContent = open ? 'Show all states' : 'Hide state key';
}

function render(expires){
  const forName = REC.practice ? (REC.practice) : (REC.name||'your practice');
  const expTxt = expires ? new Date(expires).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '';
  const oral = FORM.filter(f=>f.route==='Oral');
  const top  = FORM.filter(f=>f.route!=='Oral');
  const opts = '<option value="">Select a medication</option>'
    + '<optgroup label="Oral">'    + oral.map(f=>`<option value="${f.id}">${esc(f.product)}</option>`).join('') + '</optgroup>'
    + '<optgroup label="Topical">' + top.map(f=>`<option value="${f.id}">${esc(f.product)}</option>`).join('')  + '</optgroup>';
  window._OPTS = opts;

  app.innerHTML = `
  <div id="conf">🔒 <b>CONFIDENTIAL</b> · Prepared exclusively for <b>${esc(REC.name||'')}</b>${REC.practice?' · '+esc(REC.practice):''}. Not for distribution.${expTxt?' This private link expires <b>'+expTxt+'</b>.':''}</div>
  <div class="wrap">
    <header class="h">
      <div class="kicker">MDconcierge Pharmacy Partner</div>
      <h1>Workers' Compensation Medication Dispensing Analysis</h1>
      <div class="sub">Prepared for <b>${esc(forName)}</b> · <span id="basis-sub">Pennsylvania basis</span></div>
    </header>

    <div class="card">
      <h2>How to use this</h2>
      <p class="hint" style="margin-bottom:0;">Build your own medication mix below and the estimated practice revenue updates instantly. Every assumption is editable. The defaults are intentionally conservative (oral scripts modeled at 80% collections, topicals at 70%, and your practice keeping 65% of net). The full formulary, including product cost, is at the bottom.</p>
    </div>

    <div class="card">
      <h2>Assumptions</h2>
      <p class="hint">Editable. Pick your state and the multiplier follows its workers' compensation pharmacy fee schedule, or type your own number over it.</p>
      <div class="assume">
        <label>Patients / month<input id="a-pat" type="number" value="100" oninput="compute()"></label>
        <label>State<select id="a-state" onchange="applyState(this.value)">${STATES.map(s=>`<option value="${s.c}">${esc(s.n)}</option>`).join('')}</select></label>
        <label>AWP multiplier<input id="a-mult" type="number" step="0.001" value="1.1" oninput="multChanged()"></label>
        <label>Dispensing fee / script<input id="a-df" type="number" step="0.01" value="6" oninput="compute()"></label>
        <label>Oral collection %<input id="a-oc" type="number" value="80" oninput="compute()"></label>
        <label>Topical collection %<input id="a-tc" type="number" value="70" oninput="compute()"></label>
        <label>Practice share %<input id="a-sh" type="number" value="65" oninput="compute()"></label>
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span style="font-size:12px;color:var(--muted);">Rate basis:</span>
        <button id="dt-gr" class="dtbtn on" onclick="setDrugType('gr')">Generic</button>
        <button id="dt-br" class="dtbtn" onclick="setDrugType('br')">Brand</button>
      </div>
      <p class="hint" id="fs-note" style="margin:8px 0 0;"></p>
      <p class="hint noprint" style="margin:8px 0 0;">
        <button id="fs-key-btn" class="btn" onclick="toggleKey()">Show all states</button>
        <span style="margin-left:8px;">Fee schedules as of ${FS_ASOF}. They change; confirm your state before relying on it.</span>
      </p>
      <div id="fs-key" style="display:none;margin-top:10px;"></div>
    </div>

    <div class="card">
      <h2>Your formulary mix</h2>
      <p class="hint">Add the medications you'd realistically dispense. "Units per patient" is how many of that item an average patient receives each month.</p>
      <div id="mix"></div>
      <button class="btn noprint" onclick="addLine()">+ Add medication</button>
    </div>

    <div class="result" id="result"></div>

    <div style="text-align:center;margin:16px 0;" class="noprint">
      <button class="btn solid" onclick="window.print()">⬇ Save / print this analysis</button>
    </div>

    <div class="card">
      <h2>Full formulary <span id="basis-form" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12px;">· ${FORM.length} products</span></h2>
      <input id="fsearch" class="noprint" placeholder="Search by product, category, or route…" oninput="filterForm()">
      <div class="tablewrap">
        <table id="ftable">
          <thead><tr><th>Product</th><th>Category</th><th>Route</th><th class="num">MFG AWP</th><th class="num">Product cost</th><th class="num" id="th-reimb">PA reimb / unit</th></tr></thead>
          <tbody id="fbody"></tbody>
        </table>
      </div>
    </div>

    <p class="foot">Good-faith estimate; actual results vary by utilization, payer mix, and jurisdiction. <span id="basis-foot">Pennsylvania basis</span>. Fee schedule data as of ${FS_ASOF}.<br>
    Eric Weiscarger · MDconcierge · <a href="mailto:eric@mdconcierge.net" style="color:var(--steel);">eric@mdconcierge.net</a> · mdconcierge.net</p>
  </div>`;

  document.getElementById('fs-key').innerHTML = fsKeyHtml();
  // Default to the doctor's own state when the CRM knows it, so the numbers are right on arrival.
  const home = stateByCode(REC.state) ? REC.state.toUpperCase() : 'PA';
  document.getElementById('a-state').value = home;
  addLine(); addLine();
  applyState(home);
}

function addLine(){
  const box = document.getElementById('mix'); if(!box) return;
  const d = document.createElement('div'); d.className='mixrow';
  d.innerHTML = `<select onchange="compute()">${window._OPTS}</select>
    <input type="number" value="1" min="0" step="0.5" title="units per patient / month" oninput="compute()">
    <button class="btn noprint" onclick="this.closest('.mixrow').remove();compute()" title="remove">✕</button>`;
  box.appendChild(d);
}

function fById(id){ return FORM.find(f=>String(f.id)===String(id)); }

// Typing over the multiplier by hand has to move the formulary column too, not just the headline.
function multChanged(){ compute(); filterForm(); }

function compute(){
  const num = id => { const e=document.getElementById(id); return e?(parseFloat(e.value)||0):0; };
  const patients=num('a-pat'), mult=num('a-mult'), oc=num('a-oc')/100, tc=num('a-tc')/100, share=num('a-sh')/100;
  const fee=num('a-df');
  let oAwp=0,oCost=0,tAwp=0,tCost=0,oScripts=0,tScripts=0; const lines=[];
  document.querySelectorAll('#mix .mixrow').forEach(row=>{
    const id=(row.querySelector('select')||{}).value; const units=parseFloat((row.querySelector('input')||{}).value)||0;
    const f=fById(id); if(!f||!units) return;
    const paAwp=(Number(f.awp)||0)*mult, extAwp=units*paAwp, extCost=units*(Number(f.cost)||0);
    if(f.route==='Oral'){ oAwp+=extAwp; oCost+=extCost; oScripts+=units; } else { tAwp+=extAwp; tCost+=extCost; tScripts+=units; }
    lines.push(f.product);
  });
  // The dispensing fee is paid per script and collects at the same rate the drug does, so it
  // rides inside gross rather than being bolted on after collections.
  const oGross=(oAwp+oScripts*fee)*patients*oc, tGross=(tAwp+tScripts*fee)*patients*tc;
  const feeGross=(oScripts*fee)*patients*oc+(tScripts*fee)*patients*tc;
  const gross=oGross+tGross, cost=(oCost+tCost)*patients, net=gross-cost, practice=net*share;
  const el=document.getElementById('result'); if(!el) return;
  el.innerHTML = `
    <div class="lbl">Estimated practice ancillary revenue</div>
    <div class="big">${money(practice)}<span style="font-size:15px;color:#547;font-weight:400;"> / month</span></div>
    <div class="yr">${money(practice*12)} / year</div>
    <div class="brk">Gross (AWP collected) ${money(gross)}/mo${feeGross?' · includes '+money(feeGross)+'/mo in dispensing fees':''} · Product cost ${money(cost)}/mo · Net ${money(net)}/mo · Practice keeps ${Math.round(share*100)}% of net${lines.length?' · '+lines.length+' medication'+(lines.length>1?'s':''):''}</div>
    <div class="disc">Good-faith estimate; actual results vary by utilization, payer mix, and jurisdiction. <span id="basis-disc">${esc(basisLabel())}</span>.</div>`;
}

function fillFormTable(rows){
  const b=document.getElementById('fbody'); if(!b) return;
  // Reimbursement is derived from the live multiplier, not the stored PA figure, so the column
  // always agrees with the state selected above.
  const el=document.getElementById('a-mult');
  const mult = el ? (parseFloat(el.value)||0) : 1.1;
  b.innerHTML = rows.map(f=>`<tr>
    <td>${esc(f.product)}</td><td style="color:var(--muted);">${esc(f.category||'')}</td><td>${esc(f.route||'')}</td>
    <td class="num">${money(f.awp)}</td><td class="num">${money(f.cost)}</td><td class="num">${money((Number(f.awp)||0)*mult)}</td></tr>`).join('');
}
function filterForm(){
  const q=(document.getElementById('fsearch').value||'').toLowerCase();
  fillFormTable(FORM.filter(f=>(f.product+' '+(f.category||'')+' '+(f.route||'')).toLowerCase().includes(q)));
}

boot();
</script>
</body>
