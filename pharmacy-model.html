<script>
const FN = "https://pjdbzrzadlldojuvdrfj.supabase.co/functions/v1/formulary-access";
const PROGRAM = 'mdrx';
const app = document.getElementById('app');
const money = n => '$' + Math.round(n||0).toLocaleString('en-US');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FORM = [], REC = {};
// Someone who skipped the sign-in gets the tool and the estimate, but not the price book.
let HIDE_COST = false;

function tokenFromUrl(){
  const u = new URL(location.href);
  return u.searchParams.get('t') || u.searchParams.get('token') || '';
}
// A link can open on a practice's own assumptions rather than the page defaults, so what
// they see matches what they were sent. Same fragment, same reason: it stays out of logs.
function presetFromUrl(){
  const h = new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const q = new URL(location.href).searchParams;
  const g = k => { const v = h.get(k) || q.get(k); return v==null||v==='' ? null : parseFloat(v); };
  return { oc:g('oc'), tc:g('tc'), sh:g('share'), df:g('df'), ship:g('ship'), pat:g('pat') };
}
function trackingFromUrl(){
  return new URL(location.href).searchParams.get('p') || '';
}
// A practice can be sent its OWN formulary rather than the whole price book. The ids ride in
// the fragment, so the list never reaches a server log or a Referer header. Nothing changes
// for a link that does not carry one: the tool opens exactly as it always has.
function mineFromUrl(){
  const h = new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const q = new URL(location.href).searchParams;
  const raw = h.get('mine') || q.get('mine') || '';
  return raw.split(',').map(x=>x.trim()).filter(Boolean);
}

function watermark(name, email){
  const wm = document.getElementById('wm'); wm.innerHTML='';
  const txt = (name||'Confidential') + '  ·  ' + (email||'') ;
  for(let r=0;r<14;r++){ for(let c=0;c<4;c++){ const d=document.createElement('div'); d.textContent=txt; d.style.top=(r*130-60)+'px'; d.style.left=(c*360-120)+'px'; wm.appendChild(d); } }
}

function errScreen(reason, expires){
  const map = {
    expired: ["This link has expired","For an updated analysis, just reply to the email this link came from and I'll send a fresh one."],
    revoked: ["This link is no longer active","Please reach out to Eric for an updated link."],
    invalid: ["This link isn't valid","Double-check the link from your email, or reply and I'll resend it."],
    missing: ["No access token","Open the link exactly as it appears in your email."],
    error:   ["Something went wrong loading this","Please try again in a moment, or reply to the email for help."]
  };
  const m = map[reason] || map.error;
  const exp = expires ? '<p class="sub">Expired '+new Date(expires).toLocaleDateString()+'.</p>' : '';
  app.innerHTML = '<div class="state"><span class="pill">MDconcierge Pharmacy Partner</span><h1>'+m[0]+'</h1>'+exp+'<p class="sub">'+m[1]+'</p><p class="foot">Eric Weiscarger · MDconcierge · eric@mdconcierge.net</p></div>';
}

// The link is meant to be shareable: a doctor will send it to a partner or his administrator and
// they should get straight in. Everyone signs the guest book on the way, which costs the doctor
// one click and a guest one line, and means every copy of this page carries the name of whoever
// is looking at it. Remembered per device, so nobody is asked twice.
const whoKey = t => 'pm:who:' + t;

function identifyScreen(recipientName, practice, mode){
  const who = esc(recipientName || 'you');
  const guestForm = `
    <div style="margin:18px auto 0;max-width:340px;text-align:left;">
      <label style="display:block;font-size:12px;color:#5b6675;margin-bottom:4px;">Your name</label>
      <input id="who-name" placeholder="Jane Miller" style="width:100%;padding:11px 12px;border:1px solid #cfd8e3;border-radius:9px;font-size:15px;box-sizing:border-box;margin-bottom:10px;">
      <label style="display:block;font-size:12px;color:#5b6675;margin-bottom:4px;">Your email</label>
      <input id="who-email" type="email" autocomplete="email" placeholder="you@practice.com" style="width:100%;padding:11px 12px;border:1px solid #cfd8e3;border-radius:9px;font-size:15px;box-sizing:border-box;">
      <div id="who-msg" style="font-size:12px;color:#b4472f;min-height:16px;margin-top:6px;"></div>
      <button id="who-go" style="width:100%;background:#08214C;color:#fff;border:none;border-radius:9px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;">Open the analysis</button>
      <div style="text-align:center;margin-top:10px;"><a href="#" id="who-skip" style="font-size:12.5px;color:#5b6675;">Skip and just open it</a></div>
    </div>`;
  const chooser = `
    <div style="margin:18px auto 0;max-width:340px;">
      <button id="who-me" style="width:100%;background:#08214C;color:#fff;border:none;border-radius:9px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;">Continue as ${who}</button>
      <button id="who-other" style="width:100%;margin-top:8px;background:#fff;color:#08214C;border:1px solid #6B9FD4;border-radius:9px;padding:11px;font-weight:600;font-size:14px;cursor:pointer;">I'm someone else</button>
    </div>`;
  app.innerHTML = '<div class="state"><span class="pill">MDconcierge Pharmacy Partner</span>'
    + '<h1>Workers\' compensation dispensing analysis</h1>'
    + '<p class="sub">Prepared for <b>' + who + '</b>' + (practice ? ' · ' + esc(practice) : '') + '.</p>'
    + (mode === 'guest'
        ? '<p class="sub">Tell us who you are and it opens. This is shared with colleagues all the time, we just like to know who we are helping.</p>'
        : '<p class="sub">Confidential and prepared for one practice. Feel free to share it with your partners or your staff, we just ask each person to say who they are.</p>')
    + (mode === 'guest' ? guestForm : chooser)
    + '<p class="foot">Eric Weiscarger · MDconcierge · eric@mdconcierge.net</p></div>';

  if(mode === 'guest'){
    const n = document.getElementById('who-name'), e2 = document.getElementById('who-email'), go = document.getElementById('who-go');
    const submit = () => {
      const nm=(n.value||'').trim(), em=(e2.value||'').trim();
      if(!nm || !em || em.indexOf('@')<1){ document.getElementById('who-msg').textContent='Name and email, then you are in.'; return; }
      go.disabled = true; go.textContent = 'Opening…';
      unlock(tokenFromUrl(), {name:nm, email:em});
    };
    go.onclick = submit;
    document.getElementById('who-skip').onclick = ev => { ev.preventDefault(); unlock(tokenFromUrl(), {anon:true}); };
    [n,e2].forEach(el=>el.onkeydown = ev => { if(ev.key==='Enter') submit(); });
    n.focus();
  } else {
    document.getElementById('who-me').onclick = () => unlock(tokenFromUrl(), {name:recipientName, self:true});
    document.getElementById('who-other').onclick = () => identifyScreen(recipientName, practice, 'guest');
  }
}

async function unlock(token, viewer){
  const body = { token, p: trackingFromUrl(), program: PROGRAM };
  if (viewer) body.viewer = viewer;
  let data;
  try{
    const r = await fetch(FN, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    data = await r.json();
  }catch(e){ return errScreen('error'); }

  if(data && data.ok){
    if(viewer){ try{ localStorage.setItem(whoKey(token), JSON.stringify(viewer)); }catch(e){} }
    FORM = data.formulary || []; REC = data.recipient || {};
    VIEW_ID = data.view_id || null; VIEW_T0 = Date.now();
    const V = data.viewer || REC;
    HIDE_COST = !!V.hide_cost;
    watermark(V.name || REC.name, V.email || REC.email);
    return render(data.expires_at);
  }
  const reason = (data && data.reason) || 'error';
  if(reason === 'identify'){ return identifyScreen(data.recipient_name, data.practice, 'choose'); }
  return errScreen(reason, data && data.expires_at);
}

// Lets a skipper change their mind and sign in without hunting for the original email.
function reIdentify(){
  const t = tokenFromUrl();
  try{ localStorage.removeItem(whoKey(t)); }catch(e){}
  identifyScreen(REC.name, REC.practice, 'guest');
}

// How long they stayed. That someone opened the model says little; that he sat with it for eleven
// minutes says he is doing his own arithmetic. Reported every half minute and again on the way out,
// and the server keeps the highest figure, so a tab left open and returned to never reports less.
let VIEW_ID = null, VIEW_T0 = Date.now();
function reportDwell(){
  if(!VIEW_ID) return;
  const body = JSON.stringify({ token: tokenFromUrl(), view_id: VIEW_ID, dwell: Math.round((Date.now()-VIEW_T0)/1000) });
  try{
    if(navigator.sendBeacon){ navigator.sendBeacon(FN, new Blob([body], {type:'application/json'})); }
    else { fetch(FN, {method:'POST', headers:{'Content-Type':'application/json'}, body, keepalive:true}).catch(function(){}); }
  }catch(e){}
}
setInterval(reportDwell, 30000);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportDwell(); });
window.addEventListener('pagehide', reportDwell);

async function boot(){
  const token = tokenFromUrl();
  if(!token && !trackingFromUrl()){ return errScreen('missing'); }
  let remembered = null;
  try{ remembered = JSON.parse(localStorage.getItem(whoKey(token)) || 'null'); }catch(e){}
  unlock(token, remembered);
}

// ---- State workers' comp pharmacy fee schedules ------------------------------------------------
// Every state sets its own WC pharmacy reimbursement. Most are a percentage of AWP, which is the
// multiplier this model runs on: PA pays AWP + 10% (1.10), New York pays AWP - 12% (0.88).
// These are the PHARMACY fee schedule rates, which is what this program bills under: the script
// is filled and shipped by the mail-order pharmacy, not handed to the patient in the office. Some
// states publish a separate, higher rate for a physician who dispenses in office (Florida pays a
// dispensing practitioner AWP +12.5%); that rate does not apply here and is not used.
// br/gr are the brand and generic multipliers; dfb/dfg are the per-script dispensing fees the
// schedule pays out, shown but deliberately NOT added to the estimate, so it never overstates.
// basis 'other' means the state does not price off AWP at all (usual and customary, "reasonable",
// Medi-Cal, WAC). Those cannot honestly be reduced to a multiplier, so they say so instead.
// Sources: Optum Workers' Comp Pharmacy Resource Guide, March 2026 and 2025 editions; MyMatrixx
// regulatory rundowns 2026 for the CT, MS and AL changes. Verify before relying on it.

// The states the pharmacy is actually licensed in. The full table above is kept intact so adding
// a state later is one edit here, not a re-research job.
const ACTIVE = ['AL','AZ','CO','DC','FL','IN','KS','LA','MO','NE','NM','OK','PA','TX','VA','WI'];
const SERVED = STATES.filter(s => ACTIVE.includes(s.c));

let ST = STATES.find(s=>s.c==='PA');
// Every product in this formulary dispenses as a generic: the brand names in the product column
// are the AWP reference label, and acquisition cost sits at a median 5% of AWP, which no brand
// does. So the generic rate always applies and there is no basis to ask the doctor to choose.
// Offering the choice let someone apply a brand rate to a generic basket and understate himself
// by 20-25% in Louisiana or Texas.
const DRUGTYPE = 'gr';

function stateByCode(c){ return STATES.find(s=>s.c===String(c||'').toUpperCase()); }
// States with no published AWP schedule (usual and customary, "reasonable", prevailing community
// rate) fall back to flat AWP as the working assumption rather than leaving the doctor with a
// blank. It is still labeled as an assumption, because it is one.
function stMult(s,t){ return s ? (s.basis==='other' ? 1 : (t==='br'?s.br:s.gr)) : null; }
function basisLabel(){ return ST ? (ST.n + ' basis') : 'custom basis'; }

// Switching state rewrites the multiplier and every label that names a state, so the page can
// never show Pennsylvania wording while running New York math.
function applyState(code, keepMult){
  const s = stateByCode(code); if(!s) return;
  ST = s;
  const m = stMult(s, DRUGTYPE);
  const inp = document.getElementById('a-mult');
  if(inp && !keepMult && m != null) inp.value = m;
  // The state's own dispensing fee is extra REIMBURSEMENT the schedule pays out, which is a
  // different thing from the per-script fee the practice pays under the program. It stays
  // informational and out of the math, which keeps the estimate conservative.
  const df = DRUGTYPE==='br' ? s.dfb : s.dfg;
  const note = document.getElementById('fs-note');
  if(note){
    if(s.basis==='other'){
      note.innerHTML = '<b>'+esc(s.n)+':</b> '+esc(s.r)+'. With no published AWP schedule to follow, this is modeled at <b>flat AWP</b> as a working assumption. Change it to whatever you actually collect.';
      note.style.color = '';
    } else {
      const gr = s.gr.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
      const br = s.br.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
      note.innerHTML = '<b>'+esc(s.n)+':</b> '+esc(s.r)
        + (df ? ' &middot; the schedule also pays a $'+df.toFixed(2)+' dispensing fee per script, left out of the estimate below' : '')
        + ' &middot; generic rate '+gr+'&times; applied'
        + (s.br!==s.gr ? ' (its brand rate is '+br+'&times;, which does not apply here)' : '');
      note.style.color = '';
    }
  }
  ['basis-sub','basis-foot','basis-disc'].forEach(id=>{ const e=document.getElementById(id); if(e) e.textContent = basisLabel(); });
  const fh=document.getElementById('basis-form');
  if(fh) fh.textContent = FORM.length+' products · '+s.c+' reimbursement = '+m+' × MFG AWP'+(s.basis==='other'?' (assumed)':'');
  // The reimbursement column header carries the state code, and it is rebuilt from ST inside
  // renderFormHead, so refreshing the table is enough to relabel it.
  applyForm(); compute();
}
function fsKeyHtml(){
  const rows = SERVED.map(s=>{
    const m = stMult(s,'gr');
    const mult = s.basis==='other' ? '1 <span style="color:var(--muted);">(assumed)</span>'
      : (s.br===s.gr ? String(s.br) : (s.br+' / '+s.gr));
    return '<tr><td>'+esc(s.n)+'</td><td>'+mult+'</td><td style="color:var(--muted);">'+esc(s.r)+'</td></tr>';
  }).join('');
  return '<div class="tablewrap"><table><thead><tr><th>State</th><th>Multiplier (brand / generic)</th><th>Fee schedule rule</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function toggleKey(){
  const b=document.getElementById('fs-key'); if(!b) return;
  const open = b.style.display !== 'none';
  b.style.display = open ? 'none' : 'block';
  const t=document.getElementById('fs-key-btn'); if(t) t.textContent = open ? 'Show all states' : 'Hide state key';
}

function render(expires){
  const forName = REC.practice ? (REC.practice) : (REC.name||'your practice');
  const expTxt = expires ? new Date(expires).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '';
  const oral = FORM.filter(f=>f.route==='Oral');
  const top  = FORM.filter(f=>f.route!=='Oral');
  const opts = '<option value="">Select a medication</option>'
    + '<optgroup label="Oral">'    + oral.map(f=>`<option value="${f.id}">${esc(f.product)}</option>`).join('') + '</optgroup>'
    + '<optgroup label="Topical">' + top.map(f=>`<option value="${f.id}">${esc(f.product)}</option>`).join('')  + '</optgroup>';
  window._OPTS = opts;

  app.innerHTML = `
  <div id="conf">🔒 <b>CONFIDENTIAL</b> · Prepared exclusively for <b>${esc(REC.name||'')}</b>${REC.practice?' · '+esc(REC.practice):''}. Not for distribution.${expTxt?' This private link expires <b>'+expTxt+'</b>.':''}</div>
  <div class="wrap">
    <header class="h">
      <div class="kicker">MDconcierge Pharmacy Partner</div>
      <h1>Workers' Compensation Medication Dispensing Analysis</h1>
      <div class="sub">Prepared for <b>${esc(forName)}</b> · <span id="basis-sub">Pennsylvania basis</span></div>
    </header>

    <div class="card">
      <h2>How to use this</h2>
      <p class="hint" style="margin-bottom:0;">Build your own medication mix below and the estimated practice revenue updates instantly. Every assumption is editable. The defaults are intentionally conservative (oral scripts modeled at 80% collections, topicals at 70%, and your practice keeping 65% of net). The practice carries the cost of the medication plus a per-Rx dispensing fee and shipping, all deducted before the split. The full formulary, including product cost, is at the bottom.</p>
    </div>

    <div class="card">
      <h2>Assumptions</h2>
      <p class="hint">Editable. Pick your state and the multiplier follows its workers' compensation pharmacy fee schedule, or type your own number over it.</p>
      <div class="assume">
        <label>Patients / month<input id="a-pat" type="number" value="100" oninput="compute()"></label>
        <label>State<select id="a-state" onchange="applyState(this.value)">${SERVED.map(s=>`<option value="${s.c}">${esc(s.n)}</option>`).join('')}</select></label>
        <label>AWP multiplier<input id="a-mult" type="number" step="0.001" value="1.1" oninput="multChanged()"></label>
        <label>Dispensing fee / Rx (cost)<input id="a-df" type="number" step="0.01" value="5.75" oninput="compute()"></label>
        <label>Shipping / Rx (cost)<input id="a-ship" type="number" step="0.01" value="6" oninput="compute()"></label>
        <label>Oral collection %<input id="a-oc" type="number" value="80" oninput="compute()"></label>
        <label>Topical collection %<input id="a-tc" type="number" value="70" oninput="compute()"></label>
        <label>Practice share %<input id="a-sh" type="number" value="65" oninput="compute()"></label>
      </div>
      <p class="hint" style="margin:8px 0 0;">Every product here dispenses as a <b>generic</b>, so your state's generic rate is applied throughout. Brand names in the formulary are the AWP reference, not what ships.</p>
      <p class="hint" id="fs-note" style="margin:6px 0 0;"></p>
      <p class="hint" id="df-note" style="margin:6px 0 0;"></p>
      <p class="hint noprint" style="margin:8px 0 0;">
        <button id="fs-key-btn" class="btn" onclick="toggleKey()">Show all states</button>
        <span style="margin-left:8px;">The ${SERVED.length} states we are licensed in. Pharmacy fee schedule rates as of ${FS_ASOF}; they change, so confirm your state before relying on it.</span>
      </p>
      <div id="fs-key" style="display:none;margin-top:10px;"></div>
    </div>

    <div class="card">
      <h2>Your formulary mix</h2>
      <p class="hint">Add the medications you'd realistically dispense. "Units per patient" is how many of that item an average patient receives each month.</p>
      <div id="mix"></div>
      <button class="btn noprint" onclick="addLine()">+ Add medication</button>
    </div>

    <div class="result" id="result"></div>

    <div style="text-align:center;margin:16px 0;" class="noprint">
      <button class="btn solid" onclick="window.print()">⬇ Save / print this analysis</button>
    </div>

    <div class="card">
      <h2>Full formulary <span id="basis-form" style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:12px;">· ${FORM.length} products</span></h2>
      ${HIDE_COST?`<p class="hint" style="margin:0 0 10px;">Product cost is left out of this copy because the sign-in was skipped. <a href="#" onclick="reIdentify();return false;" style="color:var(--steel);">Add your name and email</a> and it appears.</p>`:''}
      <p class="hint noprint" style="margin:0 0 8px;">Filter and sort to find what you dispense, tick the ones you want, then add them to your mix in one go. Click any column heading to sort.</p>
      <div class="fctl noprint">
        <input id="fsearch" placeholder="Search product, category, or route…" oninput="applyForm()">
        <select id="fcat" onchange="applyForm()">${['<option value="">All categories</option>'].concat([...new Set(FORM.map(f=>f.category).filter(Boolean))].sort().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`)).join('')}</select>
        <select id="froute" onchange="applyForm()"><option value="">All routes</option><option value="Oral">Oral</option><option value="Topical">Topical</option></select>
        <button class="btn" onclick="clearForm()">Clear</button>
      </div>
      <div class="tablewrap">
        <table id="ftable">
          <thead id="fhead"></thead>
          <tbody id="fbody"></tbody>
        </table>
      </div>
      <div id="selbar" class="noprint" style="display:none;"></div>
    </div>

    <p class="foot">Good-faith estimate; actual results vary by utilization, payer mix, and jurisdiction. <span id="basis-foot">Pennsylvania basis</span>. Fee schedule data as of ${FS_ASOF}.<br>
    Eric Weiscarger · MDconcierge · <a href="mailto:eric@mdconcierge.net" style="color:var(--steel);">eric@mdconcierge.net</a> · mdconcierge.net</p>
  </div>`;

  document.getElementById('fs-key').innerHTML = fsKeyHtml();
  renderFormHead();
  // Default to the doctor's own state when the CRM knows it, so the numbers are right on arrival.
  // Only default to their own state if we actually serve it, otherwise PA.
  const rc = String(REC.state||'').toUpperCase();
  const home = ACTIVE.includes(rc) ? rc : 'PA';
  document.getElementById('a-state').value = home;
  const mine = mineFromUrl().filter(id=>FORM.some(f=>String(f.id)===String(id)));
  if(mine.length){
    mine.forEach(id=>{
      addLine();
      const rows=document.querySelectorAll('#mix .mixrow');
      const sel=rows[rows.length-1].querySelector('select');
      sel.value=String(id);
    });
    const box=document.getElementById('mix');
    if(box){
      const n=document.createElement('div');
      n.className='noprint';
      n.style.cssText='font-size:12.5px;color:#5a6675;margin:0 0 10px;padding:8px 11px;border:1px solid #e6dcc2;background:#fdf8ec;border-radius:7px;';
      n.innerHTML='This is <b>'+esc(REC.practice||'your practice')+'</b>&rsquo;s formulary, '+mine.length+
        ' medications, already filled in. Change any quantity, remove what you do not write, '+
        'and add anything else from the full formulary below.';
      box.parentNode.insertBefore(n, box);
    }
  } else {
    addLine(); addLine();
  }
  applyPreset();
  applyState(home);
}

function addLine(){
  const box = document.getElementById('mix'); if(!box) return;
  const d = document.createElement('div'); d.className='mixrow';
  d.innerHTML = `<select onchange="compute()">${window._OPTS}</select>
    <input type="number" value="1" min="0" step="0.5" title="units per patient / month" oninput="compute()">
    <button class="btn noprint" onclick="this.closest('.mixrow').remove();compute()" title="remove">✕</button>
    <div class="mixnums"></div>`;
  box.appendChild(d);
}

function applyPreset(){
  const p = presetFromUrl();
  const set = (id,v)=>{ if(v==null||isNaN(v)) return; const e=document.getElementById(id); if(e) e.value=String(v); };
  set('a-oc',p.oc); set('a-tc',p.tc); set('a-sh',p.sh);
  set('a-df',p.df); set('a-ship',p.ship); set('a-pat',p.pat);
}

function fById(id){ return FORM.find(f=>String(f.id)===String(id)); }

// Typing over the multiplier by hand has to move the formulary column too, not just the headline.
function multChanged(){ compute(); filterForm(); }

function compute(){
  const num = id => { const e=document.getElementById(id); return e?(parseFloat(e.value)||0):0; };
  const patients=num('a-pat'), mult=num('a-mult'), oc=num('a-oc')/100, tc=num('a-tc')/100, share=num('a-sh')/100;
  const fee=num('a-df'), ship=num('a-ship');
  let oAwp=0,oCost=0,tAwp=0,tCost=0,oScripts=0,tScripts=0; const lines=[];
  document.querySelectorAll('#mix .mixrow').forEach(row=>{
    const id=(row.querySelector('select')||{}).value; const units=parseFloat((row.querySelector('input')||{}).value)||0;
    const f=fById(id);
    if(!f||!units){ const n0=row.querySelector('.mixnums'); if(n0) n0.textContent=''; return; }
    const paAwp=(Number(f.awp)||0)*mult, extAwp=units*paAwp, extCost=units*(Number(f.cost)||0);
    if(f.route==='Oral'){ oAwp+=extAwp; oCost+=extCost; oScripts+=units; } else { tAwp+=extAwp; tCost+=extCost; tScripts+=units; }
    lines.push(f.product);
    // Every line carries its own arithmetic, so the figure in the tool and the figure in the
    // formulary are visibly the same number. Collections are applied per route, and the per Rx
    // dispensing and shipping are charged once per order rather than once per medication, so
    // they are not deducted here. The line reads what one fill of that product returns.
    const coll = f.route==='Oral' ? oc : tc;
    const lineNet = (paAwp*coll - (Number(f.cost)||0)) * share;
    const nums = row.querySelector('.mixnums');
    if(nums){
      nums.innerHTML = HIDE_COST
        ? 'PA fee '+money(paAwp)+' <span>per fill</span>'
        : 'Cost '+money(Number(f.cost)||0)+' <span>&middot;</span> AWP '+money(Number(f.awp)||0)
          +' <span>&middot;</span> PA fee '+money(paAwp)
          +' <span>&middot;</span> <b>'+money(lineNet)+'</b> <span>per fill</span>';
    }
  });
  // Dispensing and shipping are charges against the practice, not something it collects, and both
  // are per Rx order rather than per medication: a patient on five drugs carries one $6 dispensing
  // fee and one $6 shipping charge, not five of each.
  const oGross=oAwp*patients*oc, tGross=tAwp*patients*tc;
  const anyScripts=(oScripts+tScripts)>0;
  const feeCost=anyScripts ? (fee+ship)*patients : 0;
  const gross=oGross+tGross, cost=(oCost+tCost)*patients+feeCost, net=gross-cost, practice=net*share;
  // Say plainly that the fee is the practice's cost and that it is already taken out, rather than
  // leaving it to be discovered inside a breakdown line.
  const dfn=document.getElementById('df-note');
  if(dfn){
    dfn.innerHTML = (fee||ship)
      ? '<b>Practice pays per Rx:</b> $'+fee.toFixed(2)+' dispensing and $'+ship.toFixed(2)+' shipping, $'+(fee+ship).toFixed(2)+' in total. Both are charged once per patient order, not per medication, so a patient on five drugs still carries one of each. Both are counted as costs and are already deducted from the figures below.'
      : '<b>Dispensing and shipping:</b> none applied. Set them above if your agreement includes them.';
  }
  const el=document.getElementById('result'); if(!el) return;
  el.innerHTML = `
    <div class="lbl">Estimated practice ancillary revenue</div>
    <div class="big">${money(practice)}<span style="font-size:15px;color:#547;font-weight:400;"> / month</span></div>
    <div class="yr">${money(practice*12)} / year</div>
    <div class="brk">Gross (AWP collected) ${money(gross)}/mo · Product cost ${money(cost)}/mo${feeCost?' (includes '+money(feeCost)+'/mo in dispensing and shipping)':''} · Net ${money(net)}/mo · Practice keeps ${Math.round(share*100)}% of net${lines.length?' · '+lines.length+' medication'+(lines.length>1?'s':''):''}</div>
    <div class="disc">${(fee||ship)?('Net of the $'+(fee+ship).toFixed(2)+' per Rx the practice pays for dispensing and shipping. '):''}Good-faith estimate; actual results vary by utilization, payer mix, and jurisdiction. <span id="basis-disc">${esc(basisLabel())}</span>.</div>`;
}

// Sorting, filtering, and picking straight off the formulary. Ninety products is too many to
// hunt through in a dropdown, so the table itself is the picker: narrow it down, tick what you
// dispense, add the lot in one click.
let FSORT = { key:'product', dir:1 };
const FSEL = new Set();
const curMult = () => { const el=document.getElementById('a-mult'); return el ? (parseFloat(el.value)||0) : 1.1; };
const reimbOf = f => (Number(f.awp)||0) * curMult();

function formCols(){
  return [
    {k:'product', label:'Product'},
    {k:'category',label:'Category'},
    {k:'route',   label:'Route'},
    {k:'awp',     label:'MFG AWP', num:true},
  // No per-unit reimbursement column. It reads as a fixed figure sitting next to each product when
  // it is nothing of the kind: it moves with whichever state is chosen at the top of the page, and
  // the estimate above already states what the basket collects at that state's rate.
  ].concat(HIDE_COST?[]:[{k:'cost',label:'Product cost',num:true}]);
}
function sortForm(k){
  FSORT = (FSORT.key===k) ? {key:k, dir:-FSORT.dir} : {key:k, dir: (k==='product'||k==='category'||k==='route') ? 1 : -1};
  applyForm();
}
function renderFormHead(){
  const h=document.getElementById('fhead'); if(!h) return;
  h.innerHTML = '<tr><th style="width:34px;"></th>' + formCols().map(c=>{
    const on = FSORT.key===c.k;
    const arrow = on ? (FSORT.dir>0?' ▲':' ▼') : '';
    return `<th class="${c.num?'num ':''}sortable" onclick="sortForm('${c.k}')" title="Sort by ${esc(c.label)}">${esc(c.label)}${arrow}</th>`;
  }).join('') + '</tr>';
}
function applyForm(){
  const q=((document.getElementById('fsearch')||{}).value||'').toLowerCase();
  const cat=((document.getElementById('fcat')||{}).value||'');
  const rt=((document.getElementById('froute')||{}).value||'');
  let rows = FORM.filter(f=>{
    if(cat && (f.category||'')!==cat) return false;
    if(rt){ const isOral=(f.route==='Oral'); if(rt==='Oral'&&!isOral) return false; if(rt==='Topical'&&isOral) return false; }
    if(q && !((f.product+' '+(f.category||'')+' '+(f.route||'')).toLowerCase().includes(q))) return false;
    return true;
  });
  const k=FSORT.key, d=FSORT.dir;
  rows.sort((a,b)=>{
    const va = k==='reimb'?reimbOf(a):(k==='awp'||k==='cost'?Number(a[k])||0:String(a[k]||'').toLowerCase());
    const vb = k==='reimb'?reimbOf(b):(k==='awp'||k==='cost'?Number(b[k])||0:String(b[k]||'').toLowerCase());
    return va<vb ? -d : va>vb ? d : 0;
  });
  // Then gather into category sections. Sort is stable, so whatever the physician sorted by still
  // holds inside each section rather than being thrown away.
  if(k!=='category') rows.sort((a,b)=> String(a.category||'~').toLowerCase().localeCompare(String(b.category||'~').toLowerCase()));
  renderFormHead();
  fillFormTable(rows);
  const cnt=document.getElementById('fcount');
  if(cnt) cnt.textContent = rows.length===FORM.length ? '' : (rows.length+' of '+FORM.length+' shown');
}
function clearForm(){
  ['fsearch','fcat','froute'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  applyForm();
}
function fillFormTable(rows){
  const b=document.getElementById('fbody'); if(!b) return;
  // Sections. A flat list of eighty products asks a physician to hold the whole formulary in his
  // head; grouped under NSAIDs, Pain, Muscle Relaxants and the rest he can find his own prescribing
  // in it. The filters above still work, and the chosen sort still applies inside each section.
  let lastCat = null;
  const cols = HIDE_COST ? 5 : 6;
  b.innerHTML = rows.map(f=>{
    let head = '';
    const c = String(f.category||'Other');
    if(c !== lastCat){
      lastCat = c;
      head = `<tr class="catrow"><td colspan="${cols}">${esc(c)}</td></tr>`;
    }
    return head + `<tr class="${FSEL.has(String(f.id))?'selrow':''}" onclick="toggleSel('${f.id}')">
    <td class="noprint" style="text-align:center;"><input type="checkbox" ${FSEL.has(String(f.id))?'checked':''} onclick="event.stopPropagation();toggleSel('${f.id}')"></td>
    <td>${esc(f.product)}</td><td style="color:var(--muted);">${esc(f.category||'')}</td><td>${esc(f.route||'')}</td>
    <td class="num">${money(f.awp)}</td>${HIDE_COST?'':`<td class="num">${money(f.cost)}</td>`}</tr>`;
  }).join('');
}
function toggleSel(id){
  id=String(id);
  if(FSEL.has(id)) FSEL.delete(id); else FSEL.add(id);
  applyForm(); renderSelBar();
}
function renderSelBar(){
  const bar=document.getElementById('selbar'); if(!bar) return;
  if(!FSEL.size){ bar.style.display='none'; bar.innerHTML=''; return; }
  bar.style.display='block';
  bar.innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:11px 14px;background:#eef6ff;border:1px solid var(--steel);border-radius:10px;">
    <b style="font-size:14px;">${FSEL.size} selected</b>
    <button class="btn solid" onclick="addSelected()">Add to my mix</button>
    <button class="btn" onclick="FSEL.clear();applyForm();renderSelBar();">Clear selection</button>
  </div>`;
}
function addSelected(){
  const ids=[...FSEL];
  if(!ids.length) return;
  ids.forEach(id=>{
    // Re-use an empty row before making a new one, so the mix does not fill up with blanks.
    let row=[...document.querySelectorAll('#mix .mixrow')].find(r=>!r.querySelector('select').value);
    if(!row){ addLine(); const all=document.querySelectorAll('#mix .mixrow'); row=all[all.length-1]; }
    row.querySelector('select').value=String(id);
    if(!parseFloat(row.querySelector('input').value)) row.querySelector('input').value='1';
  });
  FSEL.clear(); applyForm(); renderSelBar(); compute();
  const mix=document.getElementById('mix');
  if(mix) mix.scrollIntoView({behavior:'smooth', block:'center'});
}
// Kept so the multiplier and state handlers can refresh the table without knowing the details.
function filterForm(){ applyForm(); }

boot();
</script>
</body>
</html>
