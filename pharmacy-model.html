<!doctype html>

<title>Workers' Compensation Medication Dispensing Analysis · MDconcierge Pharmacy Partner</title>
<style>
  :root{ --navy:#08214C; --steel:#3f6ea5; --green:#1e7a4d; --ink:#1a2233; --muted:#5b6675; --line:#e2e7ef; --bg:#f4f6fa; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
  .wrap{ max-width:940px; margin:0 auto; padding:0 18px 60px; }
  /* watermark */
  #wm{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  #wm div{ position:absolute; white-space:nowrap; transform:rotate(-30deg); color:rgba(8,33,76,.055); font-weight:700; font-size:20px; letter-spacing:1px; }
  .above{ position:relative; z-index:1; }
  /* banner */
  #conf{ background:#08214C; color:#eaf1fb; font-size:12.5px; text-align:center; padding:8px 14px; letter-spacing:.2px; }
  #conf b{ color:#fff; }
  header.h{ text-align:center; padding:26px 0 10px; }
  .kicker{ text-transform:uppercase; letter-spacing:2px; font-size:11px; color:var(--steel); font-weight:700; }
  h1{ font-family:Georgia,'Times New Roman',serif; color:var(--navy); font-size:26px; margin:6px 0 2px; }
  .sub{ color:var(--muted); font-size:14px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:16px 0; box-shadow:0 1px 3px rgba(16,33,66,.05); }
  .card h2{ font-size:14px; text-transform:uppercase; letter-spacing:1px; color:var(--navy); margin:0 0 4px; }
  .hint{ font-size:12px; color:var(--muted); margin:0 0 12px; }
  .assume{ display:flex; flex-wrap:wrap; gap:14px; }
  .assume label{ font-size:11px; color:var(--muted); font-weight:600; }
  .assume input{ display:block; margin-top:4px; width:92px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; color:var(--ink); }
  .assume select{ display:block; margin-top:4px; width:150px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; color:var(--ink); background:#fff; }
  .fctl{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:center; }
  .fctl input, .fctl select{ padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:14px; color:var(--ink); background:#fff; }
  .fctl input{ flex:1; min-width:200px; }
  th.sortable{ cursor:pointer; user-select:none; white-space:nowrap; }
  th.sortable:hover{ color:var(--navy); }
  #ftable tbody tr, #mtable tbody tr{ cursor:pointer; }
  #mtable tbody tr:hover{ background:#f6f9fd; }
  #mtable tbody tr.selrow{ background:#eef6ff; }
  #mtable tbody tr.catrow td{ background:#f0f4fa; font-weight:800; font-size:11.5px; letter-spacing:.6px;
    text-transform:uppercase; color:var(--navy); cursor:default; }
  #mtable input.qty{ width:64px; padding:5px 7px; border:1px solid var(--line); border-radius:6px;
    font-size:13px; text-align:right; }
  #mtable .rm{ border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer;
    padding:3px 8px; color:#8a94a4; font-size:13px; }
  #mtable .rm:hover{ color:#9b3b2e; border-color:#9b3b2e; }
  td.net{ font-weight:700; color:#0f5132; }
  #ftable tbody tr:hover{ background:#f6f9fd; }
  #ftable tbody tr.selrow{ background:#eef6ff; }
  #ftable tbody tr.catrow td{ background:#f0f4fa; font-weight:800; font-size:11.5px; letter-spacing:.6px;
    text-transform:uppercase; color:var(--navy); cursor:default; }
  .btn{ border:1px solid var(--steel); background:#fff; color:var(--navy); border-radius:8px; padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn:hover{ background:#eef3fb; }
  .btn.solid{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .result{ background:linear-gradient(180deg,#f0f8f3,#eaf6ef); border:1px solid #bfe0cd; border-radius:14px; padding:20px; text-align:center; }
  .result .lbl{ text-transform:uppercase; letter-spacing:1px; font-size:11px; color:#3d7d5c; font-weight:700; }
  .result .big{ font-size:40px; font-weight:800; color:var(--green); line-height:1.1; margin:2px 0; }
  .result .yr{ font-size:20px; font-weight:700; color:var(--green); }
  .result .brk{ font-size:12.5px; color:#547; margin-top:10px; }
  .result .disc{ font-size:11px; color:#7a8596; font-style:italic; margin-top:8px; }
  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td{ text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th{ color:var(--navy); font-size:11px; text-transform:uppercase; letter-spacing:.5px; position:sticky; top:0; background:#fff; }
  td.num,th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .tablewrap{ max-height:420px; overflow:auto; border:1px solid var(--line); border-radius:10px; }
  #fsearch{ width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:13px; margin-bottom:10px; }
  .foot{ text-align:center; color:var(--muted); font-size:12px; margin-top:22px; }
  .state{ text-align:center; padding:70px 20px; }
  .state h1{ font-size:22px; }
  .pill{ display:inline-block; background:#eef3fb; color:var(--steel); font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
  @media print{
    body{ background:#fff; } #conf{ background:#08214C !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .noprint{ display:none !important; } .tablewrap{ max-height:none; } #wm div{ color:rgba(8,33,76,.07); }
  }

  .sbtabs{ display:flex; gap:6px; margin:0 0 16px; border-bottom:1px solid var(--line);
    flex-wrap:wrap; align-items:flex-end; }
  .sbt{ padding:12px 20px; border:none; background:none; font-family:inherit; font-size:17px;
    font-weight:800; letter-spacing:.2px; color:#8a94a4; cursor:pointer;
    border-bottom:3px solid transparent; margin-bottom:-1px; }
  .sbt:hover{ color:var(--navy); }
  .sbt.on{ color:var(--navy); border-bottom-color:var(--navy); }
  .sbcta{ display:flex; align-items:center; justify-content:space-between; gap:14px;
    width:100%; margin:0 0 18px; padding:15px 20px; cursor:pointer; text-align:left;
    font-family:inherit; font-size:15.5px; font-weight:800; letter-spacing:.4px;
    color:#fff; background:var(--navy); border:none; border-radius:10px; }
  .sbcta:hover{ background:#0d2c63; }
  .sbcta .ar{ font-size:20px; font-weight:400; opacity:.85; }
</style>

  for(var i=0;i<b.length;i++) b[i].classList.toggle('on', i===n-1);

}

nter;}\n#sb-tab2 .pt.sel .h{background:var(--navy);}\n#sb-tab2 .pt .h span{font-weight:400;opacity:.85;font-size:11.5px;}\n#sb-tab2 .pt .b{padding:12px 14px;min-height:74px;}\n#sb-tab2 .pick div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid #EEF3F9;}\n#sb-tab2 .pick .x{border:none;background:none;color:#b0453a;cursor:pointer;font-size:15px;line-height:1;padding:0 4px;}\n#sb-tab2 .pick .none{color:var(--faint);font-style:italic;border:none;justify-content:flex-start;}\n#sb-tab2 .tot{border-top:1px solid var(--border);margin-top:9px;padding-top:9px;font-size:13px;display:flex;justify-content:space-between;}\n#sb-tab2 .tot b{color:var(--navy);}\n#sb-tab2 .res{background:var(--navy);color:#fff;border-radius:12px;padding:17px 19px;}\n#sb-tab2 .res .big{font-size:37px;font-weight:800;line-height:1.05;}\n#sb-tab2 .res .sm{font-size:14px;opacity:.85;}\n#sb-tab2 .res .brk{font-size:12px;opacity:.72;margin-top:8px;line-height:1.65;}\n#sb-tab2 table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}\n#sb-tab2 th{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);text-align:left;padding:0 8px 6px;border-bottom:1px solid var(--border);}\n#sb-tab2 th.n, #sb-tab2 td.n{text-align:right;font-variant-numeric:tabular-nums;}\n#sb-tab2 th.s{cursor:pointer;user-select:none;}\n#sb-tab2 th.s:hover{color:var(--navy);}\n#sb-tab2 td{padding:6px 8px;border-bottom:1px solid #EEF3F9;}\n#sb-tab2 tr.cat td{background:#F0F4FA;font-weight:800;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--navy);}\n#sb-tab2 tr.lvl td{background:var(--wash);font-weight:700;color:#8A6414;}\n#sb-tab2 tr.on td{background:#EEF6FF;}\n#sb-tab2 .how{background:#fff;border-left:4px solid var(--blue);}\n#sb-tab2 .how h3:first-of-type{margin-top:4px;padding-top:0;border-top:none;}\n#sb-tab2 .how ol{margin:0 0 4px 18px;}\n#sb-tab2 .how li{font-size:13.5px;color:var(--ink);margin-bottom:7px;padding-left:3px;}\n#sb-tab2 .how h3{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--navy);margin:15px 0 7px;padding-top:13px;border-top:1px solid var(--border);}\n#sb-tab2 .how p{font-size:13.5px;color:var(--ink);margin-bottom:8px;}\n#sb-tab2 .how .cav{font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:9px;margin-top:11px;}\n#sb-tab2 .say{font-size:17px;line-height:2.05;color:var(--ink);max-width:640px;}\n#sb-tab2 .say input{width:62px;font-size:16px;font-weight:700;color:var(--navy);text-align:center;padding:5px 4px;\n  border:none;border-bottom:2px solid var(--blue);border-radius:0;background:#F4F8FE;margin:0 2px;}\n#sb-tab2 .say input:focus{outline:none;background:#E8F1FE;}\n#sb-tab2 .dv{margin:13px 0 0;padding:10px 13px;background:#EEF6FF;border-left:3px solid var(--blue);\n  border-radius:0 7px 7px 0;font-size:13.5px;color:var(--ink);line-height:1.6;}\n#sb-tab2 .swap{margin-top:10px;font-size:12.5px;color:var(--faint);}\n#sb-tab2 .lk{border:none;background:none;padding:0;font:inherit;color:var(--blue);cursor:pointer;text-decoration:underline;}\n#sb-tab2 h3.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--navy);\n  margin:22px 0 4px;padding-top:15px;border-top:1px solid var(--border);}\n#sb-tab2 .cases{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;}\n#sb-tab2 .case{flex:1 1 300px;border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:#fff;}\n#sb-tab2 .case.lead{flex:1 1 300px;background:var(--navy);border-color:var(--navy);color:#fff;}\n#sb-tab2 .case .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--faint);font-weight:700;}\n#sb-tab2 .case.lead .k{color:#9FB6DA;}\n#sb-tab2 .case .big{font-size:38px;font-weight:800;line-height:1.08;margin-top:3px;}\n#sb-tab2 .case .mid{font-size:25px;font-weight:800;line-height:1.15;margin-top:3px;color:var(--navy);}\n#sb-tab2 .case .sm{font-size:12.5px;opacity:.8;margin-top:2px;}\n#sb-tab2 .case .as{font-size:12px;margin-top:11px;padding-top:9px;border-top:1px solid var(--border);color:var(--muted);}\n#sb-tab2 .case .as div{display:flex;justify-content:space-between;align-items:center;padding:3px 0;}\n#sb-tab2 .case .as input{width:52px;padding:3px 4px;text-align:center;font-weight:700;font-size:13px;\n  color:var(--navy);border:1px solid var(--border);border-radius:6px;background:#fff;}\n#sb-tab2 .case .as b{font-weight:700;color:var(--navy);}\n#sb-tab2 .case.lead .as{border-top-color:#2A4676;color:#9FB6DA;}\n#sb-tab2 .case.lead .as b{color:#fff;}\n#sb-tab2 .case.lead .as input{color:#fff;background:#16336A;border-color:#2A4676;}\n#sb-tab2 .unit{margin-top:13px;padding:10px 13px;background:#F0F7F2;border-left:3px solid var(--green);\n  border-radius:0 7px 7px 0;font-size:13.5px;color:var(--ink);}\n#sb-tab2 .cash{border-top:1px solid var(--border);padding-top:10px;}\n#sb-tab2 .pr{padding:4px 11px;margin-left:7px;border:1px solid var(--border);border-radius:7px;background:#fff;\n  color:var(--blue);font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;vertical-align:middle;}\n#sb-tab2 .pr:hover{background:#F0F6FF;}\n#sb-tab2 .stamp{display:none;}\n@media print{#sb-tab2{background:#fff;}\n#sb-tab2 .wrap{max-width:none;padding:0;}\n#sb-tab2 .pre, #sb-tab2 .pr, #sb-tab2 .swap, #sb-tab2 #q, #sb-tab2 #ftable, #sb-tab2 .hint, #sb-tab2 input[type=range]{display:none!important;}\n#sb-tab2 .how ol{display:none!important;}\n#sb-tab2 .stamp{display:block;font-size:12px;color:#444;border:1px solid #bbb;border-radius:8px;\n    padding:9px 12px;margin-bottom:14px;line-height:1.7;}\n#sb-tab2 .card{border:1px solid #bbb;break-inside:avoid;page-break-inside:avoid;}\n#sb-tab2 .case.lead, #sb-tab2 .res{-webkit-print-color-adjust:exact;print-color-adjust:exact;}\n#sb-tab2 .say input{border-bottom:1px solid #666;background:none;}\n#sb-tab2 a[href]:after{content:\"\";}}\n#sb-tab2 .seg{display:flex;gap:6px;}\n#sb-tab2 .seg .md{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;}\n#sb-tab2 .seg .md.on{background:var(--navy);border-color:var(--navy);color:#fff;}\n#sb-tab2 .note{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.6;}";
  document.head.appendChild(st);
  PANE.innerHTML="<div class=\"stamp\" id=\"sb-stamp\"></div>\n<p class=\"sub\">Build your two patients, say how many you see, and let the refills stack.\n  <button type=\"button\" class=\"pr\" onclick=\"window.print()\">Print</button>\n</p>\n\n<div class=\"card how\" id=\"sb-how\"><div class=\"howb\">\n  <ol>\n    <li><b>Pick your state.</b> Every figure on the page is priced on that state's workers' compensation pharmacy fee schedule. It is the single biggest reason two practices doing identical work see different numbers.</li>\n    <li><b>Build your two patients.</b> Click <i>Non-surgical patient</i>, then tick the medications you would normally write for one, in the formulary at the bottom. Click <i>Surgical patient</i> and tick the extras a post-operative patient gets on top of that. Both patients are yours to define; nothing is prefilled and nothing is suggested.</li>\n    <li><b>Say how many you see.</b> Either how many arrive each month, or how many you have on treatment right now. The page converts one to the other so you can see both.</li>\n    <li><b>Set how long they stay on treatment.</b> This is the refill stack, and it is the largest lever on the page.</li>\n  </ol>\n\n  <h3>The logic underneath</h3>\n  <p>The non-surgical package is what a patient receives <b>every month</b> they are on treatment. The surgical list is <b>first month only</b>, on top of that same package, because those are the post-operative items.</p>\n  <p>So a patient you started in January is still filling in March. At three months on treatment, three months of arrivals are all filling at once, which is why the steady-state figure is roughly three times the first month. The month by month table below shows it building.</p>\n  <p><b>Practice share</b> is what is left after the pharmacy is paid: 65 percent of what the carrier pays, less the cost of goods, and the cost of goods includes an $8.17 dispensing fee on every medication plus $6.50 shipping, charged once for the patient rather than once for each medication. It is collections less cost of goods, dispensing and shipping. What a carrier actually settles is set further down, separately for surgical and non-surgical claims, and the practice carries the cost of goods and the fees on every fill whatever the carrier pays. Carriers decide what they pay and when, so treat every figure here as a good-faith estimate on published schedules rather than a quote.</p>\n  <p class=\"cav\">MDconcierge is not a pharmacy and does not practise medicine. Nothing here recommends a medication or suggests what to prescribe. The lists are yours to build.</p>\n</div></div>\n\n<div class=\"card\">\n  <h2>Jurisdiction</h2>\n  <p class=\"hint\">Licensed in 16 states. Picking a state sets the multiplier from its workers' compensation pharmacy fee schedule.</p>\n  <div class=\"row\">\n    <div style=\"display:none;\"><select id=\"sb-st\" onchange=\"SB.onState()\"></select></div>\n    <div id=\"sb-manual\" style=\"display:none;\"><label class=\"c\">AWP multiplier</label><input id=\"sb-mult\" type=\"number\" step=\"0.01\" value=\"1.00\" oninput=\"SB.recalc()\"></div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2>Create patient</h2>\n  <p class=\"hint\">Click the patient you want to build, then tick medications in the formulary below and they drop into that one. The X removes a line. <b>Non-surgical repeats every month.</b> <b>Surgical is the first month only</b>, on top of the non-surgical package.</p>\n  <div class=\"two\">\n    <div class=\"pt sel\" data-box=\"core\"><div class=\"h\">Non-surgical patient <span>every month on treatment</span></div>\n      <div class=\"b\"><div id=\"sb-ln-core\" class=\"pick\"></div>\n        <div class=\"tot\"><span id=\"sb-n-core\"></span><b id=\"sb-v-core\">$0</b></div></div></div>\n    <div class=\"pt\" data-box=\"post\"><div class=\"h\">Surgical patient <span>extras in the first month, on top of the package</span></div>\n      <div class=\"b\"><div id=\"sb-ln-post\" class=\"pick\"></div>\n        <div class=\"tot\"><span id=\"sb-n-post\"></span><b id=\"sb-v-post\">$0</b></div></div></div>\n  </div>\n</div>\n\n<div class=\"card\">\n  <h2>How many, and for how long</h2>\n  <p class=\"hint\">Fill in the blanks the way you would say it out loud.</p>\n\n  <p class=\"say\"><span id=\"sb-w1\">Each month I see</span>\n    <input id=\"sb-ns\" type=\"number\" min=\"0\" value=\"8\" oninput=\"SB.recalc()\"> surgical\n    and <input id=\"sb-nn\" type=\"number\" min=\"0\" value=\"12\" oninput=\"SB.recalc()\"> non-surgical\n    <span id=\"sb-w2\">new workers&rsquo; compensation patients,</span>\n    and they stay on medication for about\n    <input id=\"sb-mo\" type=\"number\" min=\"1\" max=\"12\" value=\"3\" oninput=\"SB.recalc()\"> months.</p>\n  <input id=\"sb-mo-r\" type=\"range\" min=\"1\" max=\"12\" value=\"3\" oninput=\"document.getElementById('sb-mo').value=this.value;SB.recalc();\" style=\"width:100%;max-width:430px;margin:2px 0 0;\">\n\n  <p class=\"dv\" id=\"sb-derived\"></p>\n\n  <h3 class=\"sec\">What the carrier actually pays</h3>\n  <p class=\"hint\">Every one of these patients gets the medication, so the question is never how many sign up. It is what share of the billed dollars a carrier settles, and that runs differently for a surgical claim than a non-surgical one. Change the percentages in either box.</p>\n  <p class=\"note\">The rate follows the patient, not the pill: a surgical patient is billed at the surgical rate on his first month and on every refill after it.</p>\n  <p class=\"swap\">Counting it the other way round?\n    <button type=\"button\" class=\"lk\" data-mode=\"tot\">I would rather enter the patients I have on treatment right now</button>\n    <button type=\"button\" class=\"lk\" data-mode=\"new\" style=\"display:none;\">I would rather enter how many new patients arrive each month</button></p>\n  <table id=\"sb-ramp\"></table>\n  <div class=\"cases\">\n    <div class=\"case lead\">\n      <div class=\"k\">Expected</div>\n      <div class=\"big\" id=\"sb-c-md\">&mdash;</div>\n      <div class=\"sm\" id=\"sb-y-md\"></div>\n      <div class=\"as\">\n        <div><span>Surgical claims pay</span>\n          <b><input id=\"sb-rs-md\" type=\"number\" min=\"0\" max=\"100\" value=\"95\" oninput=\"SB.recalc()\">%</b></div>\n        <div><span>Non-surgical claims pay</span>\n          <b><input id=\"sb-rn-md\" type=\"number\" min=\"0\" max=\"100\" value=\"80\" oninput=\"SB.recalc()\">%</b></div>\n      </div>\n    </div>\n    <div class=\"case\">\n      <div class=\"k\">Upside</div>\n      <div class=\"big\" id=\"sb-c-hi\">&mdash;</div>\n      <div class=\"sm\" id=\"sb-y-hi\"></div>\n      <div class=\"as\">\n        <div><span>Surgical claims pay</span>\n          <b><input id=\"sb-rs-hi\" type=\"number\" min=\"0\" max=\"100\" value=\"100\" oninput=\"SB.recalc()\">%</b></div>\n        <div><span>Non-surgical claims pay</span>\n          <b><input id=\"sb-rn-hi\" type=\"number\" min=\"0\" max=\"100\" value=\"90\" oninput=\"SB.recalc()\">%</b></div>\n      </div>\n    </div>\n  </div>\n  <p class=\"unit\" id=\"sb-unit\"></p>\n  <div class=\"res\" style=\"margin-top:14px;\">\n    <div style=\"font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:.6px;\">How the expected case is built</div>\n    <div class=\"brk\" id=\"sb-brk\"></div>\n  </div>\n  <p class=\"note\" id=\"sb-cmp\"></p>\n  <p class=\"note cash\"><b>On timing.</b> None of this arrives on day one. There is onboarding before the first script is written, and a carrier takes its own time to pay it. Read the month figures as the shape of the thing once it is running, not as a calendar.</p>\n</div>\n\n<div class=\"card\">\n  <h2>The full formulary</h2>\n  <p class=\"hint\">Everything the programme carries, by category, priced on the state above. Tick a line to add it to whichever patient is selected.</p>\n  <input id=\"sb-q\" placeholder=\"Search by name, strength or size\" oninput=\"SB.drawTable()\" style=\"width:100%;max-width:420px;\">\n  <div style=\"overflow-x:auto;\"><table id=\"sb-ftable\"></table></div>\n  <p class=\"note\" id=\"sb-fcount\"></p>\n</div>";

function NET(C,G){ return 0.65*C-G; }

var L={core:[],post:[]}, ACTIVE='core', SORT={k:'p',dir:1}, MODE='new';

  }).join('');
}
function rate(){
  var st=GID('sb-st').value, v=FEE_SCHED[st]||[];
  var manual=v[0]===null;
  GID('sb-manual').style.display=manual?'':'none';
  if(manual) return {m:parseFloat(GID('sb-mult').value)||1, f:0, label:st+', rate set by hand'};
  return {m:v[0], f:v[1], label:st+', '+v[4]};
}
function onState(){ recalc(); drawTable(); }
function setActive(k){

    }).join('');
  });
}
function recalc(){
  var r=rate();
  var rd=function(id){ return Math.min(100,Math.max(0,+GID(id).value||0))/100; };
  var CS=rd('rs-md'), CN=rd('rn-md');
  var val=function(l){ var t=0; for(var i=0;i<l.length;i++) t+=F_DATA[l[i]].a*r.m+r.f; return t; };

  // however many medications are in the box. Dispensing is charged on each one.
  var cog=function(l){ if(!l.length) return 0;
    var t=SHIP_FEE; for(var i=0;i<l.length;i++) t+=F_DATA[l[i]].c+DISP_FEE; return t; };
  // A carrier paying 85 percent pays 85 percent of the BILL. The practice still bought the drug
  // at full price and still owes the fee, so col scales C and never touches G.
  var pv=function(l,c){ return NET(val(l)*c, cog(l)); };
  var all=L.core.concat(L.post);
  var non=pv(L.core,CN), sur=pv(all,CS);
  GID('sb-n-core').textContent=L.core.length+' fills a month';
  GID('sb-v-core').textContent=money(non)+' a patient';
  GID('sb-n-post').textContent=L.post.length+' extra in month one';
  GID('sb-v-post').textContent=money(sur)+' first month';

  var a=+GID('sb-ns').value||0, b=+GID('sb-nn').value||0;
  var mo=Math.min(12,Math.max(1,+GID('sb-mo').value||1));
  GID('sb-mo-r').value=mo;
  // Two ways a doctor counts his panel, and they are three times apart at three months.
  //   new     he sees this many arrive each month. On treatment builds to new x months.
  //   total   this many have an active prescription right now. New arrivals are total / months,
  //           and only those carry the post-operative extras.
  var ns, nn, onTx;
  if(MODE==='new'){ ns=a; nn=b; onTx=(a+b)*mo; }
  else { ns=a/mo; nn=b/mo; onTx=a+b; }
  var arriv=Math.round(ns+nn), refill=Math.max(0,Math.round(onTx)-arriv);
  GID('sb-w1').textContent = MODE==='new' ? 'Each month I see' : 'Right now I have';
  GID('sb-w2').innerHTML   = MODE==='new'
    ? 'new workers&rsquo; compensation patients,' : 'workers&rsquo; compensation patients on treatment,';
  GID('sb-derived').innerHTML = MODE==='new'
    ? '<b>'+arriv+' arrive a month and each one keeps filling for '+mo+' months.</b> So once it has filled up you have <b>'
      + Math.round(onTx)+' patients filling at the same time</b>: '+arriv+' new that month and '+refill+' on refills.'
    : '<b>'+Math.round(onTx)+' on treatment, spread over '+mo+' months, means about '+arriv+' arrive each month.</b>'
      + ' The other '+refill+' are on refills. Only the '+arriv+' arriving carry the surgical first month extras.';
  // One case is a claim. Three cases, with the worst one carrying the headline, is a range he
  // can argue with. The bands are fixed and stated, so nothing here is a black box.

    return { v:v, yr:y, steady:v[11], cs:cs, cn:cn };
  };
  var MD=ser(CS,CN);
  var HI=ser(rd('rs-hi'),rd('rn-hi'));
  var pct=function(x){ return Math.round(x*100)+'%'; };
  var put=function(id,yid,c){
    GID(id).textContent=money(c.steady)+' a month';
    GID(yid).textContent=money(c.yr)+' across twelve months';

function drawTable(){
  var r=rate();
  var q=(GID('sb-q').value||'').toLowerCase().trim();
  var rows=[];
  for(var i=0;i<F_DATA.length;i++){
    var x=F_DATA[i];

    var pays=x.a*r.m+r.f;
    rows.push({i:i,p:x.p,g:x.g,rt:x.r,a:x.a,c:x.c,pays:pays,share:NET(pays,x.c+DISP_FEE)});
  }
  rows.sort(function(a,b){
    if(SORT.k!=='p' && a.g!==b.g) return a.g.localeCompare(b.g);
    if(SORT.k==='p' && a.g!==b.g) return a.g.localeCompare(b.g);
    var va=a[SORT.k], vb=b[SORT.k];
    if(typeof va==='string') return SORT.dir*va.localeCompare(vb);
    return SORT.dir*(va-vb);
  });
  var stc=GID('sb-st').value;
  var cols=[['p','Product',''],['rt','Route',''],['a','AWP','n'],['c','Cost','n'],
            ['pays',stc+' fee schedule','n'],['share','Practice share','n']];

  for(var c=0;c<cols.length;c++) h+='<th class="s '+cols[c][2]+'" data-k="'+cols[c][0]+'">'+cols[c][1]+'</th>';

    var x=rows[j];
    if(x.g!==last){ h+='<tr class="cat"><td colspan="7">'+x.g+'</td></tr>'; last=x.g; }

       '</td><td class="n" style="color:var(--muted);">'+money(x.c)+'</td><td class="n">'+money(x.pays)+
       '</td><td class="n"><b style="color:'+(x.share<0?'#b0453a':'var(--green)')+';">'+money(x.share)+'</b></td></tr>';
  }
  GID('sb-ftable').innerHTML=h;
  GID('sb-fcount').textContent=rows.length+' of '+F_DATA.length+
    ' products, priced on '+r.label+'. Ticking adds to the '+(ACTIVE==='core'?'non-surgical':'surgical')+
    ' patient. Practice share here is after cost of goods and the $'+DISP_FEE.toFixed(2)+
    ' dispensing fee on that medication. Shipping of $'+SHIP_FEE.toFixed(2)+
    ' is added once per patient a month, not once per medication, so it is not in these rows.';

    recalc(); return;
  }
  var th=t.closest? t.closest('th.s') : null;
  if(th){ var k=th.getAttribute('data-k'); SORT.dir=(SORT.k===k?-SORT.dir:1); SORT.k=k; drawTable(); return; }
  var card=t.closest? t.closest('.pt') : null;

});


  window.SB={recalc:recalc,onState:onState,drawTable:drawTable};

  // follow the one state selector the tool already has
  var LIVE=document.getElementById('a-state');

    var sync=function(){
      var sel=GID('st'); if(!sel) return;
      for(var i=0;i<sel.options.length;i++){
        if(sel.options[i].value===LIVE.value){ sel.value=LIVE.value; break; }

<script>
const FN = "https://pjdbzrzadlldojuvdrfj.supabase.co/functions/v1/formulary-access";
const PROGRAM = 'mdrx';
const app = document.getElementById('app');
const money = n => '$' + Math.round(n||0).toLocaleString('en-US');
// Cents matter wherever the number has to match the formulary line for line.
const money2 = n => '$' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FORM = [], REC = {};
// Someone who skipped the sign-in gets the tool and the estimate, but not the price book.
let HIDE_COST = false;

function tokenFromUrl(){
  const u = new URL(location.href);
  return u.searchParams.get('t') || u.searchParams.get('token') || '';
}
// A link can open on a practice's own assumptions rather than the page defaults, so what
// they see matches what they were sent. Same fragment, same reason: it stays out of logs.
function presetFromUrl(){
  const h = new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const q = new URL(location.href).searchParams;
  const g = k => { const v = h.get(k) || q.get(k); return v==null||v==='' ? null : parseFloat(v); };
  return { oc:g('oc'), tc:g('tc'), sh:g('share'), df:g('df'), ship:g('ship'), pat:g('pat') };
}
function trackingFromUrl(){
  return new URL(location.href).searchParams.get('p') || '';
}
// A practice can be sent its OWN formulary rather than the whole price book. The ids ride in
// the fragment, so the list never reaches a server log or a Referer header. Nothing changes
// for a link that does not carry one: the tool opens exactly as it always has.
function mineFromUrl(){
  const h = new URLSearchParams(String(location.hash||'').replace(/^#/,''));
  const q = new URL(location.href).searchParams;
  const raw = h.get('mine') || q.get('mine') || '';
  return raw.split(',').map(x=>x.trim()).filter(Boolean);
}

function watermark(name, email){
  const wm = document.getElementById('wm'); wm.innerHTML='';
  const txt = (name||'Confidential') + '  ·  ' + (email||'') ;
  for(let r=0;r<14;r++){ for(let c=0;c<4;c++){ const d=document.createElement('div'); d.textContent=txt; d.style.top=(r*130-60)+'px'; d.style.left=(c*360-120)+'px'; wm.appendChild(d); } }
}

function errScreen(reason, expires){
  const map = {
    expired: ["This link has expired","For an updated analysis, just reply to the email this link came from and I'll send a fresh one."],
    revoked: ["This link is no longer active","Please reach out to Eric for an updated link."],
    invalid: ["This link isn't valid","Double-check the link from your email, or reply and I'll resend it."],
    missing: ["No access token","Open the link exactly as it appears in your email."],
    error:   ["Something went wrong loading this","Please try again in a moment, or reply to the email for help."]
  };
  const m = map[reason] || map.error;
  const exp = expires ? '<p class="sub">Expired '+new Date(expires).toLocaleDateString()+'.</p>' : '';
  app.innerHTML = '<div class="state"><span class="pill">MDconcierge Pharmacy Partner</span><h1>'+m[0]+'</h1>'+exp+'<p class="sub">'+m[1]+'</p><p class="foot">Eric Weiscarger · MDconcierge · eric@mdconcierge.net</p></div>';
}

// The link is meant to be shareable: a doctor will send it to a partner or his administrator and
// they should get straight in. Everyone signs the guest book on the way, which costs the doctor
// one click and a guest one line, and means every copy of this page carries the name of whoever
// is looking at it. Remembered per device, so nobody is asked twice.
const whoKey = t => 'pm:who:' + t;

function identifyScreen(recipientName, practice, mode){
  const who = esc(recipientName || 'you');
  const guestForm = `
    <div style="margin:18px auto 0;max-width:340px;text-align:left;">

async function unlock(token, viewer){
  const body = { token, p: trackingFromUrl(), program: PROGRAM };
  if (viewer) body.viewer = viewer;
  let data;
  try{
    const r = await fetch(FN, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    data = await r.json();
  }catch(e){ return errScreen('error'); }

  if(data && data.ok){
    if(viewer){ try{ localStorage.setItem(whoKey(token), JSON.stringify(viewer)); }catch(e){} }
    FORM = data.formulary || []; REC = data.recipient || {};
    VIEW_ID = data.view_id || null; VIEW_T0 = Date.now();
    const V = data.viewer || REC;
    HIDE_COST = !!V.hide_cost;
    watermark(V.name || REC.name, V.email || REC.email);
    return render(data.expires_at);
  }
  const reason = (data && data.reason) || 'error';
  if(reason === 'identify'){ return identifyScreen(data.recipient_name, data.practice, 'choose'); }
  return errScreen(reason, data && data.expires_at);
}

// How long they stayed. That someone opened the model says little; that he sat with it for eleven
// minutes says he is doing his own arithmetic. Reported every half minute and again on the way out,
// and the server keeps the highest figure, so a tab left open and returned to never reports less.
let VIEW_ID = null, VIEW_T0 = Date.now();
function reportDwell(){
  if(!VIEW_ID) return;
  const body = JSON.stringify({ token: tokenFromUrl(), view_id: VIEW_ID, dwell: Math.round((Date.now()-VIEW_T0)/1000) });
  try{
    if(navigator.sendBeacon){ navigator.sendBeacon(FN, new Blob([body], {type:'application/json'})); }
    else { fetch(FN, {method:'POST', headers:{'Content-Type':'application/json'}, body, keepalive:true}).catch(function(){}); }
  }catch(e){}
}
setInterval(reportDwell, 30000);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') reportDwell(); });
window.addEventListener('pagehide', reportDwell);

async function boot(){
  const token = tokenFromUrl();
  if(!token && !trackingFromUrl()){ return errScreen('missing'); }
  let remembered = null;
  try{ remembered = JSON.parse(localStorage.getItem(whoKey(token)) || 'null'); }catch(e){}

}

  {c:'TN',n:'Tennessee',br:1.00,gr:1.00,dfb:5.10,dfg:5.10,r:'AWP (no percentage adjustment)'},
  {c:'TX',n:'Texas',br:1.09,gr:1.25,dfb:4.00,dfg:4.00,r:'AWP + 9% brand, AWP + 25% generic'},
  {c:'UT',n:'Utah',basis:'other',r:'"Reasonable" charge, no AWP fee schedule'},
  {c:'VT',n:'Vermont',br:1.00,gr:1.00,dfb:3.15,dfg:3.15,r:'AWP (no percentage adjustment)'},
  {c:'VA',n:'Virginia',basis:'other',r:'Prevailing community rate, no AWP fee schedule'},
  {c:'WA',n:'Washington',basis:'other',r:'State fee schedule, not an AWP multiplier'},
  {c:'WV',n:'West Virginia',basis:'other',r:'Usual and customary, no AWP fee schedule'},
  {c:'WI',n:'Wisconsin',br:1.00,gr:1.00,dfb:3.00,dfg:3.00,r:'AWP (no percentage adjustment)'},
  {c:'WY',n:'Wyoming',br:0.90,gr:0.90,dfb:5.00,dfg:5.00,r:'AWP - 10%'}
];
// The states the pharmacy is actually licensed in. The full table above is kept intact so adding
// a state later is one edit here, not a re-research job.
const ACTIVE = ['AL','AZ','CO','DC','FL','IN','KS','LA','MO','NE','NM','OK','PA','TX','VA','WI'];
const SERVED = STATES.filter(s => ACTIVE.includes(s.c));

let ST = STATES.find(s=>s.c==='PA');
// Every product in this formulary dispenses as a generic: the brand names in the product column
// are the AWP reference label, and acquisition cost sits at a median 5% of AWP, which no brand
// does. So the generic rate always applies and there is no basis to ask the doctor to choose.
// Offering the choice let someone apply a brand rate to a generic basket and understate himself
// by 20-25% in Louisiana or Texas.
const DRUGTYPE = 'gr';

function stateByCode(c){ return STATES.find(s=>s.c===String(c||'').toUpperCase()); }
// States with no published AWP schedule (usual and customary, "reasonable", prevailing community
// rate) fall back to flat AWP as the working assumption rather than leaving the doctor with a
// blank. It is still labeled as an assumption, because it is one.
function stMult(s,t){ return s ? (s.basis==='other' ? 1 : (t==='br'?s.br:s.gr)) : null; }
function basisLabel(){ return ST ? (ST.n + ' basis') : 'custom basis'; }
// The fee column is the selected state's schedule, so it carries that state's name rather
// than a fixed Pennsylvania label.
function feeLabel(){ return (ST && ST.c ? ST.c : 'State') + ' fee'; }

// Switching state rewrites the multiplier and every label that names a state, so the page can
// never show Pennsylvania wording while running New York math.
function applyState(code, keepMult){
  const s = stateByCode(code); if(!s) return;
  ST = s;
  const m = stMult(s, DRUGTYPE);
  const inp = document.getElementById('a-mult');
  if(inp && !keepMult && m != null) inp.value = m;
  // The state's own dispensing fee is extra REIMBURSEMENT the schedule pays out, which is a
  // different thing from the per-script fee the practice pays under the program. It stays
  // informational and out of the math, which keeps the estimate conservative.
  if(typeof renderFormHead==='function') renderFormHead();
  if(typeof renderMix==='function') renderMix();
  const df = DRUGTYPE==='br' ? s.dfb : s.dfg;
  const note = document.getElementById('fs-note');
  if(note){
    if(s.basis==='other'){
      note.innerHTML = '<b>'+esc(s.n)+':</b> '+esc(s.r)+'. With no published AWP schedule to follow, this is modeled at <b>flat AWP</b> as a working assumption. Change it to whatever you actually collect.';
      note.style.color = '';
    } else {
      const gr = s.gr.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
      const br = s.br.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
      note.innerHTML = '<b>'+esc(s.n)+':</b> '+esc(s.r)
        + (df ? ' &middot; the schedule also pays a $'+df.toFixed(2)+' dispensing fee per script, left out of the estimate below' : '')
        + ' &middot; generic rate '+gr+'&times; applied'
        + (s.br!==s.gr ? ' (its brand rate is '+br+'&times;, which does not apply here)' : '');
      note.style.color = '';
    }
  }
  ['basis-sub','basis-foot','basis-disc'].forEach(id=>{ const e=document.getElementById(id); if(e) e.textContent = basisLabel(); });
  const fh=document.getElementById('basis-form');
  if(fh) fh.textContent = FORM.length+' products · '+s.c+' reimbursement = '+m+' × MFG AWP'+(s.basis==='other'?' (assumed)':'');
  // The reimbursement column header carries the state code, and it is rebuilt from ST inside
  // renderFormHead, so refreshing the table is enough to relabel it.
  applyForm(); compute();
}

function applyPreset(){

  const set = (id,v)=>{ if(v==null||isNaN(v)) return; const e=document.getElementById(id); if(e) e.value=String(v); };
  set('a-oc',p.oc); set('a-tc',p.tc); set('a-sh',p.sh);
  set('a-df',p.df); set('a-ship',p.ship); set('a-pat',p.pat);
}

function fById(id){ return FORM.find(f=>String(f.id)===String(id)); }

// The practice's own formulary: a list of {id, units}. It is the single source for the
// table, the totals and the line arithmetic.
let MIX = [];
let MSEL = new Set();

function mixCols(){
  return [{k:'product',label:'Product'},{k:'category',label:'Category'},{k:'route',label:'Route'},
          {k:'awp',label:'MFG AWP',num:true}]
    .concat(HIDE_COST?[]:[{k:'cost',label:'Product cost',num:true}])
    .concat([{k:'fee',label:feeLabel(),num:true},{k:'net',label:'Net / fill',num:true}]);
}

// One fill of one product, worked out exactly as the printed formulary works it out, so the
// figure on screen and the figure on the page they were sent are the same number.
function lineNet(f){
  const num = id => { const e=document.getElementById(id); return e?(parseFloat(e.value)||0):0; };
  const mult=num('a-mult'), share=num('a-sh')/100;
  const coll=(f.route==='Oral'?num('a-oc'):num('a-tc'))/100;
  const fee=num('a-df'), ship=num('a-ship');
  const paAwp=(Number(f.awp)||0)*mult;
  return { fee:paAwp, net:(paAwp*coll-(Number(f.cost)||0)-fee-ship)*share };
}

function renderMix(){
  const head=document.getElementById('mhead'), body=document.getElementById('mbody');
  const empty=document.getElementById('mixempty'), wrap=document.querySelector('#mtable');
  if(!head||!body) return;
  head.innerHTML='<tr><th style="width:34px;"></th>'
    + mixCols().map(c=>`<th class="${c.num?'num':''}">${esc(c.label)}</th>`).join('')
    + '<th class="num" style="width:78px;">Units</th><th class="noprint" style="width:44px;"></th></tr>';
  const cols = mixCols().length + 3;
  let lastCat=null;
  body.innerHTML = MIX.map(m=>{
    const f=fById(m.id); if(!f) return '';
    const c=String(f.category||'Other');
    let head2='';
    if(c!==lastCat){ lastCat=c; head2=`<tr class="catrow"><td colspan="${cols}">${esc(c)}</td></tr>`; }
    const L=lineNet(f);
    return head2 + `<tr class="${MSEL.has(String(f.id))?'selrow':''}" onclick="toggleMixSel('${f.id}')">
      <td class="noprint" style="text-align:center;"><input type="checkbox" ${MSEL.has(String(f.id))?'checked':''} onclick="event.stopPropagation();toggleMixSel('${f.id}')"></td>
      <td>${esc(f.product)}</td><td style="color:var(--muted);">${esc(f.category||'')}</td><td>${esc(f.route||'')}</td>
      <td class="num">${money2(f.awp)}</td>${HIDE_COST?'':`<td class="num">${money2(f.cost)}</td>`}
      <td class="num">${money2(L.fee)}</td><td class="num net">${money2(L.net)}</td>
      <td class="num"><input class="qty" type="number" min="0" step="0.5" value="${m.units}"
        onclick="event.stopPropagation();" oninput="setUnits('${f.id}',this.value)"></td>
      <td class="noprint" style="text-align:center;"><button class="rm" title="Remove from formulary"
        onclick="event.stopPropagation();removeFromFormulary(['${f.id}'])">&#10005;</button></td></tr>`;
  }).join('');
  if(empty) empty.style.display = MIX.length ? 'none' : '';
  if(wrap) wrap.style.display = MIX.length ? '' : 'none';
  renderMixBar();
}

// The assumptions drive every line, so the table is redrawn when they move.
function renderMixNums(){
  const body=document.getElementById('mbody'); if(!body) return;
  const rows=[...body.querySelectorAll('tr')].filter(r=>!r.classList.contains('catrow'));
  let i=0;
  MIX.forEach(m=>{
    const f=fById(m.id); if(!f) return;
    const tr=rows[i++]; if(!tr) return;
    const L=lineNet(f), tds=tr.querySelectorAll('td');
    const feeIdx = HIDE_COST ? 5 : 6, netIdx = feeIdx+1;
    if(tds[feeIdx]) tds[feeIdx].textContent=money2(L.fee);
    if(tds[netIdx]) tds[netIdx].textContent=money2(L.net);
  });

function setUnits(id,v){
  const m=MIX.find(x=>String(x.id)===String(id)); if(!m) return;
  m.units=parseFloat(v)||0; compute();
}

function addToFormulary(ids){
  ids.forEach(id=>{ if(!MIX.some(m=>String(m.id)===String(id))) MIX.push({id:String(id), units:1}); });
  sortMix(); renderMix(); compute();
}

function removeFromFormulary(ids){
  const drop=new Set(ids.map(String));
  MIX = MIX.filter(m=>!drop.has(String(m.id)));
  drop.forEach(d=>MSEL.delete(d));
  renderMix(); compute(); applyForm();
}

// Keep the practice's formulary in the same order as the full one below it.
function sortMix(){
  const order = new Map(FORM.map((f,i)=>[String(f.id),i]));
  MIX.sort((a,b)=>(order.get(String(a.id))??0)-(order.get(String(b.id))??0));
}

// Typing over the multiplier by hand has to move the formulary column too, not just the headline.
function multChanged(){ compute(); filterForm(); }

function compute(){
  const num = id => { const e=document.getElementById(id); return e?(parseFloat(e.value)||0):0; };
  const patients=num('a-pat'), mult=num('a-mult'), oc=num('a-oc')/100, tc=num('a-tc')/100, share=num('a-sh')/100;
  const fee=num('a-df'), ship=num('a-ship');
  let oAwp=0,oCost=0,tAwp=0,tCost=0,oScripts=0,tScripts=0; const lines=[];
  MIX.forEach(m=>{
    const f=fById(m.id); const units=Number(m.units)||0;
    if(!f||!units) return;
    const paAwp=(Number(f.awp)||0)*mult, extAwp=units*paAwp, extCost=units*(Number(f.cost)||0);
    if(f.route==='Oral'){ oAwp+=extAwp; oCost+=extCost; oScripts+=units; } else { tAwp+=extAwp; tCost+=extCost; tScripts+=units; }
    lines.push(f.product);
  });
  // Dispensing and shipping are charges against the practice, not something it collects, and both
  // are per Rx order rather than per medication: a patient on five drugs carries one $6 dispensing
  // fee and one $6 shipping charge, not five of each.
  const oGross=oAwp*patients*oc, tGross=tAwp*patients*tc;
  const anyScripts=(oScripts+tScripts)>0;
  const feeCost=anyScripts ? (fee+ship)*patients : 0;
  const gross=oGross+tGross, cost=(oCost+tCost)*patients+feeCost, net=gross-cost, practice=net*share;
  // Say plainly that the fee is the practice's cost and that it is already taken out, rather than
  // leaving it to be discovered inside a breakdown line.
  const dfn=document.getElementById('df-note');
  if(dfn){
    dfn.innerHTML = (fee||ship)
      ? '<b>Practice pays per Rx:</b> $'+fee.toFixed(2)+' dispensing and $'+ship.toFixed(2)+' shipping, $'+(fee+ship).toFixed(2)+' in total. Both are charged once per patient order, not per medication, so a patient on five drugs still carries one of each. Both are counted as costs and are already deducted from the figures below.'
      : '<b>Dispensing and shipping:</b> none applied. Set them above if your agreement includes them.';
  }
  if(typeof renderMixNums==='function') renderMixNums();
  if(typeof applyForm==='function' && document.getElementById('fbody')) applyForm();
  const el=document.getElementById('result'); if(!el) return;
  el.innerHTML = `
    <div class="lbl">Estimated practice ancillary revenue</div>
    <div class="big">${money(practice)}<span style="font-size:15px;color:#547;font-weight:400;"> / month</span></div>
    <div class="yr">${money(practice*12)} / year</div>
    <div class="brk">Gross (AWP collected) ${money(gross)}/mo · Product cost ${money(cost)}/mo${feeCost?' (includes '+money(feeCost)+'/mo in dispensing and shipping)':''} · Net ${money(net)}/mo · Practice keeps ${Math.round(share*100)}% of net${lines.length?' · '+lines.length+' medication'+(lines.length>1?'s':''):''}</div>
    <div class="disc">${(fee||ship)?('Net of the $'+(fee+ship).toFixed(2)+' per Rx the practice pays for dispensing and shipping. '):''}Good-faith estimate; actual results vary by utilization, payer mix, and jurisdiction. <span id="basis-disc">${esc(basisLabel())}</span>.</div>`;
}

// Sorting, filtering, and picking straight off the formulary. Ninety products is too many to
// hunt through in a dropdown, so the table itself is the picker: narrow it down, tick what you
// dispense, add the lot in one click.
let FSORT = { key:'product', dir:1 };
const FSEL = new Set();
const curMult = () => { const el=document.getElementById('a-mult'); return el ? (parseFloat(el.value)||0) : 1.1; };
const reimbOf = f => (Number(f.awp)||0) * curMult();

function formCols(){
  return [
    {k:'product', label:'Product'},
    {k:'category',label:'Category'},
    {k:'route',   label:'Route'},
    {k:'awp',     label:'MFG AWP', num:true},
  // No per-unit reimbursement column. It reads as a fixed figure sitting next to each product when
  // it is nothing of the kind: it moves with whichever state is chosen at the top of the page, and
  // the estimate above already states what the basket collects at that state's rate.
  ].concat(HIDE_COST?[]:[{k:'cost',label:'Product cost',num:true}])
   .concat([{k:'fee',label:feeLabel(),num:true},{k:'net',label:'Net / fill',num:true}]);
}
// The two computed columns sort on what they display, not on a stored field.
function fVal(f,k){
  if(k==='fee') return lineNet(f).fee;
  if(k==='net') return lineNet(f).net;
  return f[k];
}
function sortForm(k){
  FSORT = (FSORT.key===k) ? {key:k, dir:-FSORT.dir} : {key:k, dir: (k==='product'||k==='category'||k==='route') ? 1 : -1};
  applyForm();
}
function renderFormHead(){
  const h=document.getElementById('fhead'); if(!h) return;
  h.innerHTML = '<tr><th style="width:34px;"></th>' + formCols().map(c=>{
    const on = FSORT.key===c.k;
    const arrow = on ? (FSORT.dir>0?' ▲':' ▼') : '';
    return `<th class="${c.num?'num ':''}sortable" onclick="sortForm('${c.k}')" title="Sort by ${esc(c.label)}">${esc(c.label)}${arrow}</th>`;
  }).join('') + '</tr>';
}
function applyForm(){
  const q=((document.getElementById('fsearch')||{}).value||'').toLowerCase();
  const cat=((document.getElementById('fcat')||{}).value||'');
  const rt=((document.getElementById('froute')||{}).value||'');
  let rows = FORM.filter(f=>{
    if(cat && (f.category||'')!==cat) return false;
    if(rt){ const isOral=(f.route==='Oral'); if(rt==='Oral'&&!isOral) return false; if(rt==='Topical'&&isOral) return false; }
    if(q && !((f.product+' '+(f.category||'')+' '+(f.route||'')).toLowerCase().includes(q))) return false;
    return true;
  });
  const k=FSORT.key, d=FSORT.dir;
  rows.sort((a,b)=>{
    const NUM = (k==='awp'||k==='cost'||k==='fee'||k==='net');
    const va = k==='reimb'?reimbOf(a):(NUM?Number(fVal(a,k))||0:String(a[k]||'').toLowerCase());
    const vb = k==='reimb'?reimbOf(b):(NUM?Number(fVal(b,k))||0:String(b[k]||'').toLowerCase());
    return va<vb ? -d : va>vb ? d : 0;
  });
  // Then gather into category sections. Sort is stable, so whatever the physician sorted by still
  // holds inside each section rather than being thrown away.
  if(k!=='category') rows.sort((a,b)=> String(a.category||'~').toLowerCase().localeCompare(String(b.category||'~').toLowerCase()));
  renderFormHead();
  fillFormTable(rows);
  const cnt=document.getElementById('fcount');
  if(cnt) cnt.textContent = rows.length===FORM.length ? '' : (rows.length+' of '+FORM.length+' shown');
}
function clearForm(){
  ['fsearch','fcat','froute'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  applyForm();
}
function fillFormTable(rows){
  const b=document.getElementById('fbody'); if(!b) return;
  // Sections. A flat list of eighty products asks a physician to hold the whole formulary in his
  // head; grouped under NSAIDs, Pain, Muscle Relaxants and the rest he can find his own prescribing
  // in it. The filters above still work, and the chosen sort still applies inside each section.
  let lastCat = null;
  const cols = (HIDE_COST ? 5 : 6) + 2;
  b.innerHTML = rows.map(f=>{
    let head = '';
    const c = String(f.category||'Other');
    if(c !== lastCat){
      lastCat = c;
      head = `<tr class="catrow"><td colspan="${cols}">${esc(c)}</td></tr>`;
    }
    const on = MIX.some(m=>String(m.id)===String(f.id));
    return head + `<tr class="${FSEL.has(String(f.id))?'selrow':''}" onclick="toggleSel('${f.id}')" title="${on?'Already on the formulary':''}">
    <td class="noprint" style="text-align:center;"><input type="checkbox" ${FSEL.has(String(f.id))?'checked':''} onclick="event.stopPropagation();toggleSel('${f.id}')"></td>
    <td>${esc(f.product)}${on?' <span style="font-size:10.5px;color:#8a94a4;border:1px solid #d7dee9;border-radius:3px;padding:1px 5px;">on formulary</span>':''}</td><td style="color:var(--muted);">${esc(f.category||'')}</td><td>${esc(f.route||'')}</td>
    <td class="num">${money2(f.awp)}</td>${HIDE_COST?'':`<td class="num">${money2(f.cost)}</td>`}
    <td class="num">${money2(lineNet(f).fee)}</td><td class="num net">${money2(lineNet(f).net)}</td></tr>`;
  }).join('');
}
function toggleSel(id){
  id=String(id);
  if(FSEL.has(id)) FSEL.delete(id); else FSEL.add(id);
  applyForm(); renderSelBar();
}
function renderSelBar(){
  const bar=document.getElementById('selbar'); if(!bar) return;
  if(!FSEL.size){ bar.style.display='none'; bar.innerHTML=''; return; }
  bar.style.display='block';
  bar.innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:11px 14px;background:#eef6ff;border:1px solid var(--steel);border-radius:10px;">
    <b style="font-size:14px;">${FSEL.size} selected</b>
    <button class="btn solid" onclick="addSelected()">Add to formulary</button>
    <button class="btn" onclick="FSEL.clear();applyForm();renderSelBar();">Clear selection</button>
  </div>`;
}
function addSelected(){
  const ids=[...FSEL];
  if(!ids.length) return;
  addToFormulary(ids);
  FSEL.clear(); applyForm(); renderSelBar();
  const mix=document.getElementById('mtable');
  if(mix) mix.scrollIntoView({behavior:'smooth', block:'center'});
}
// Kept so the multiplier and state handlers can refresh the table without knowing the details.
function filterForm(){ applyForm(); }

boot();
</script>
